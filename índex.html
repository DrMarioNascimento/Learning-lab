<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Laboratório do Pesquisador – Delineamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --paper: #f3ebd4;
  --paper-2: #e9dcb8;
  --paper-3: #ddd0ab;
  --ink: #1f1810;
  --ink-soft: #5a4e3c;
  --green-dark: #123b29;
  --green-mid: #1e4a3a;
  --green-ok: #3d6b4a;
  --gold: #d4a84b;
  --gold-soft: #e8cd93;
  --gold-dim: #9c7936;
  --red: #9e2b2e;
  --line: rgba(24,72,52,.14);
  --shadow: 0 10px 28px rgba(29,50,39,.16);
  --display: 'Oswald', "Arial Narrow", sans-serif;
  --body: 'Lora', Georgia, serif;
  --mono: 'IBM Plex Mono', "Courier New", monospace;
  --radius: 8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:var(--body);
  color:#173d2d;
  background:
    radial-gradient(ellipse 90% 55% at 12% -8%, rgba(255,255,255,.9), transparent 52%),
    radial-gradient(ellipse 70% 40% at 95% 5%, rgba(212,168,75,.12), transparent 45%),
    linear-gradient(165deg, #dce7dd 0%, #e9eee7 40%, #f7f3e8 100%);
  min-height:100vh;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:540px;margin:0 auto;min-height:100vh;padding-bottom:32px;position:relative;}

/* Brand */
.brand{
  display:flex;justify-content:space-between;align-items:flex-end;
  border-bottom:1px solid var(--line);padding:14px 16px 10px;margin-bottom:4px;
}
.brand-name{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#7a5721;}
.brand-title{font-family:var(--display);font-size:1.28rem;font-weight:700;color:var(--green-dark);}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.04em;
  padding:14px 18px;border:none;border-radius:8px;cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  text-align:center;position:relative;
}
.btn-primary{
  background:linear-gradient(180deg, #1a4d35 0%, var(--green-dark) 100%);
  color:var(--paper);
  box-shadow:
    0 1px 0 rgba(255,255,255,.12) inset,
    0 4px 0 #0a2418,
    0 8px 16px rgba(18,59,41,.28);
}
.btn-primary:hover{background:linear-gradient(180deg, #226040 0%, #1a4d35 100%);}
.btn-primary:active{
  transform:translateY(3px);
  box-shadow:
    0 1px 0 rgba(255,255,255,.08) inset,
    0 1px 0 #0a2418,
    0 3px 8px rgba(18,59,41,.2);
}
.btn-secondary{
  background:linear-gradient(180deg, #fffef9 0%, var(--paper) 100%);
  color:var(--green-dark);
  border:1.5px solid rgba(18,59,41,.22);
  box-shadow:
    0 1px 0 rgba(255,255,255,.7) inset,
    0 3px 0 rgba(18,59,41,.12),
    0 6px 14px rgba(29,50,39,.1);
}
.btn-secondary:hover{background:linear-gradient(180deg, #fff 0%, #f8f1dc 100%);}
.btn-secondary:active{
  transform:translateY(2px);
  box-shadow:
    0 1px 0 rgba(255,255,255,.5) inset,
    0 1px 0 rgba(18,59,41,.1),
    0 2px 6px rgba(29,50,39,.08);
}
.btn-gold{
  background:linear-gradient(180deg, #e8c56a 0%, var(--gold) 100%);
  color:var(--ink);font-weight:700;
  box-shadow:
    0 1px 0 rgba(255,255,255,.35) inset,
    0 4px 0 #a67c28,
    0 8px 16px rgba(166,124,40,.3);
}
.btn-gold:hover{background:linear-gradient(180deg, #f0d480 0%, #e0b850 100%);}
.btn-gold:active{
  transform:translateY(3px);
  box-shadow:
    0 1px 0 rgba(255,255,255,.25) inset,
    0 1px 0 #a67c28,
    0 3px 8px rgba(166,124,40,.22);
}
.btn-ghost{background:transparent;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;width:auto;padding:8px 4px;font-size:11.5px;box-shadow:none;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-block{width:100%;}
.btn-row{display:flex;gap:10px;margin-top:14px;}
.btn-row .btn{flex:1;}

/* Cards & layout */
.section{padding:12px 16px 20px;}
.card{
  background:linear-gradient(165deg, #fffef9 0%, var(--paper) 100%);
  border-radius:10px;padding:16px;margin-bottom:12px;
  border:1px solid rgba(24,72,52,.1);
  box-shadow:
    0 1px 0 rgba(255,255,255,.65) inset,
    0 2px 4px rgba(29,50,39,.06),
    0 8px 20px rgba(29,50,39,.12);
}
.muted{color:var(--ink-soft);font-size:13px;}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7a5721;display:block;margin-bottom:4px;}

/* Home */
.home-hero{text-align:center;padding:22px 10px 14px;}
.home-hero h1{font-family:var(--display);font-size:1.65rem;color:var(--green-dark);line-height:1.15;}
.home-hero p{font-size:14px;color:var(--ink-soft);margin-top:8px;}
.home-actions{display:flex;flex-direction:column;gap:10px;margin-top:18px;}

/* Subarea grid */
.subarea-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.subarea-btn{
  background:linear-gradient(165deg, #fffef9 0%, var(--paper) 100%);
  border:1.5px solid rgba(24,72,52,.12);
  border-radius:10px;padding:14px 10px;text-align:left;cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  font-family:var(--body);color:var(--ink);
  box-shadow:
    0 1px 0 rgba(255,255,255,.7) inset,
    0 3px 0 rgba(18,59,41,.1),
    0 6px 14px rgba(29,50,39,.1);
}
.subarea-btn:hover{
  border-color:var(--gold);
  transform:translateY(-2px);
  box-shadow:
    0 1px 0 rgba(255,255,255,.8) inset,
    0 4px 0 rgba(18,59,41,.12),
    0 10px 22px rgba(29,50,39,.14);
}
.subarea-btn:active{
  transform:translateY(1px);
  box-shadow:
    0 1px 0 rgba(255,255,255,.5) inset,
    0 1px 0 rgba(18,59,41,.1),
    0 3px 8px rgba(29,50,39,.08);
}
.subarea-btn .num{font-family:var(--mono);font-size:10px;color:var(--gold);letter-spacing:.08em;}
.subarea-btn .nome{font-family:var(--display);font-size:13.5px;font-weight:600;color:var(--green-dark);margin-top:3px;line-height:1.25;}

/* Session / rigor bar (sticky) */
.session-bar{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg, var(--green-dark), var(--green-mid));
  color:var(--paper);padding:10px 14px 12px;border-bottom:2px solid var(--gold);
}
.session-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.session-top .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-soft);}
.session-top .fase-label{font-family:var(--display);font-size:0.9rem;letter-spacing:.04em;}
.pillars{display:flex;gap:7px;}
.pillar{flex:1;}
.pillar-label{font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;color:rgba(243,235,212,.75);margin-bottom:3px;display:flex;justify-content:space-between;}
.pillar-track{height:5px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden;}
.pillar-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .45s ease;}
.fase-dots{display:flex;gap:5px;margin-top:6px;}
.fase-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.22);}
.fase-dot.on{background:var(--gold);}
.acervo-btn{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  background:transparent;border:1px solid var(--gold-dim);color:var(--gold-soft);
  border-radius:3px;padding:5px 9px;cursor:pointer;
}

/* Scenario */
.scenario-box{
  background:linear-gradient(165deg, #fffef9 0%, var(--paper) 100%);
  border-radius:10px;padding:16px;margin-bottom:12px;
  border:1px solid rgba(24,72,52,.1);border-left:4px solid var(--gold);
  box-shadow:
    0 1px 0 rgba(255,255,255,.65) inset,
    0 2px 4px rgba(29,50,39,.06),
    0 8px 20px rgba(29,50,39,.12);
}
.scenario-box h3{font-family:var(--display);font-size:1.08rem;color:var(--green-dark);margin-bottom:8px;text-transform:none;letter-spacing:0;}
.scenario-box p{font-size:13.5px;margin-bottom:8px;}
.scenario-box .pergunta{font-style:italic;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:8px;margin-top:6px;}
.level-chip{
  font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;
  padding:3px 8px;border-radius:10px;border:1px solid currentColor;display:inline-block;
}
.lvl-facil{color:#3f7a5f;}.lvl-medio{color:var(--gold-dim);}.lvl-dificil{color:var(--red);}

/* Orientador */
.orientador{
  display:flex;gap:12px;align-items:flex-start;
  background:rgba(18,59,41,.07);border-radius:var(--radius);padding:12px 14px;margin:12px 0;
  border-left:3px solid var(--gold);
}
.orientador.warn{background:rgba(158,43,46,.08);border-left-color:var(--red);}
.orientador-avatar{
  width:42px;height:42px;border-radius:50%;flex-shrink:0;
  background:var(--green-dark);color:var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:15px;font-weight:700;
}
.orientador-name{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--gold-dim);margin-bottom:3px;}
.orientador-text{font-size:13px;line-height:1.5;color:var(--ink);}

/* Expandable theory cards (open fully — page scrolls, not the card) */
.flip-grid{display:flex;flex-direction:column;gap:12px;margin:10px 0;}
.opt-card{
  background:linear-gradient(165deg, #fffef9 0%, var(--paper) 100%);
  border:1.5px solid rgba(24,72,52,.12);
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  box-shadow:
    0 1px 0 rgba(255,255,255,.7) inset,
    0 3px 0 rgba(18,59,41,.1),
    0 6px 16px rgba(29,50,39,.11);
}
.opt-card:active{transform:translateY(1px);}
.opt-card.open{
  border-color:rgba(18,59,41,.2);
  box-shadow:
    0 1px 0 rgba(255,255,255,.65) inset,
    0 4px 0 rgba(18,59,41,.12),
    0 10px 24px rgba(29,50,39,.16);
}
.opt-card.selected{
  border-color:var(--gold);
  box-shadow:
    0 0 0 2px var(--gold-soft),
    0 1px 0 rgba(255,255,255,.7) inset,
    0 4px 0 rgba(166,124,40,.2),
    0 10px 22px rgba(29,50,39,.14);
}
.opt-card-head{
  padding:14px 16px;
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
}
.opt-card .opt-title{font-family:var(--display);font-size:15px;font-weight:600;color:var(--green-dark);line-height:1.25;}
.opt-card .opt-extra{font-size:12px;color:var(--ink-soft);margin-top:3px;}
.opt-card .opt-chevron{
  font-family:var(--mono);font-size:11px;color:var(--gold-dim);
  flex:none;padding:2px 0;transition:transform .2s ease;
}
.opt-card.open .opt-chevron{transform:rotate(180deg);}
.opt-card-body{
  display:none;
  padding:0 16px 16px;
  border-top:1px solid rgba(24,72,52,.08);
  background:rgba(18,59,41,.03);
}
.opt-card.open .opt-card-body{display:block;}
.opt-card-body p{
  font-size:13px;line-height:1.55;color:var(--ink);
  margin:12px 0 14px;
}
.opt-card .select-btn{
  display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
  background:linear-gradient(180deg, #e8c56a 0%, var(--gold) 100%);
  color:var(--ink);padding:9px 14px;border-radius:6px;border:none;font-weight:600;cursor:pointer;
  box-shadow:
    0 1px 0 rgba(255,255,255,.3) inset,
    0 3px 0 #a67c28,
    0 5px 12px rgba(166,124,40,.25);
  transition:transform .12s ease, box-shadow .12s ease;
}
.opt-card .select-btn:active{
  transform:translateY(2px);
  box-shadow:
    0 1px 0 rgba(255,255,255,.2) inset,
    0 1px 0 #a67c28,
    0 2px 6px rgba(166,124,40,.2);
}
.opt-card .select-btn.on{
  background:linear-gradient(180deg, #1a4d35 0%, var(--green-dark) 100%);
  color:var(--paper);
  box-shadow:
    0 1px 0 rgba(255,255,255,.12) inset,
    0 3px 0 #0a2418,
    0 5px 12px rgba(18,59,41,.25);
}

/* Phase 3 choice tiles */
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;}
.choice-tile{
  border:1.5px solid rgba(24,72,52,.12);border-radius:10px;padding:13px 11px;text-align:left;
  background:linear-gradient(165deg, #fffef9 0%, var(--paper) 100%);
  cursor:pointer;transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  box-shadow:
    0 1px 0 rgba(255,255,255,.7) inset,
    0 3px 0 rgba(18,59,41,.1),
    0 6px 14px rgba(29,50,39,.1);
}
.choice-tile:active{transform:translateY(1px);}
.choice-tile.on{
  border-color:var(--gold);
  background:linear-gradient(165deg, #fff9e8 0%, #fbf3df 100%);
  box-shadow:
    0 0 0 2px var(--gold-soft),
    0 1px 0 rgba(255,255,255,.7) inset,
    0 3px 0 rgba(166,124,40,.18),
    0 8px 18px rgba(29,50,39,.12);
}
.choice-tile .cname{font-family:var(--display);font-size:14px;color:var(--green-dark);font-weight:600;}
.choice-tile .cdesc{font-size:11.5px;color:var(--ink-soft);margin-top:3px;line-height:1.35;}

/* Form fields */
.field{margin-bottom:12px;}
.field label{display:block;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--green-mid);margin-bottom:5px;}
.field textarea,.field input[type=text]{
  width:100%;font-family:var(--body);font-size:13.5px;padding:10px 12px;
  border:1.5px solid var(--line);border-radius:6px;background:#fffef9;color:var(--ink);resize:vertical;
}
.field textarea{min-height:68px;}
.hint{font-size:12px;color:var(--ink-soft);margin-top:3px;}

/* Armadilhas */
.quiz-item{
  border:1px solid rgba(24,72,52,.1);border-radius:10px;padding:14px;margin-bottom:12px;
  background:linear-gradient(165deg, #fffef9 0%, var(--paper) 100%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.65) inset,
    0 2px 4px rgba(29,50,39,.05),
    0 6px 14px rgba(29,50,39,.09);
}
.quiz-item p.stmt{font-style:italic;color:var(--green-dark);margin-bottom:10px;font-size:13.5px;}
.quiz-btns{display:flex;gap:8px;}
.quiz-btn{
  flex:1;border:1.5px solid rgba(18,59,41,.25);border-radius:7px;padding:11px 8px;
  font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;
  background:linear-gradient(180deg, #fffef9 0%, var(--paper) 100%);color:var(--green-dark);cursor:pointer;
  box-shadow:
    0 1px 0 rgba(255,255,255,.7) inset,
    0 2px 0 rgba(18,59,41,.1),
    0 4px 10px rgba(29,50,39,.08);
  transition:transform .12s ease, box-shadow .12s ease;
}
.quiz-btn:active:not(:disabled){
  transform:translateY(2px);
  box-shadow:
    0 1px 0 rgba(255,255,255,.5) inset,
    0 1px 0 rgba(18,59,41,.08),
    0 2px 4px rgba(29,50,39,.06);
}
.quiz-btn.correct{
  background:linear-gradient(180deg, #4a8a5c 0%, var(--green-ok) 100%);color:#fff;border-color:var(--green-ok);
  box-shadow:0 1px 0 rgba(255,255,255,.15) inset, 0 2px 0 #2a5035, 0 4px 10px rgba(61,107,74,.3);
}
.quiz-btn.wrong{
  background:linear-gradient(180deg, #b84848 0%, var(--red) 100%);color:#fff;border-color:var(--red);
  box-shadow:0 1px 0 rgba(255,255,255,.12) inset, 0 2px 0 #6e1e20, 0 4px 10px rgba(158,43,46,.3);
}
.quiz-feedback{margin-top:10px;font-size:12.5px;padding:10px;border-radius:5px;background:rgba(18,59,41,.06);line-height:1.45;}

/* Parecer */
.stamp-wrap{display:flex;flex-direction:column;align-items:center;padding:18px 8px 6px;}
.stamp{
  width:148px;height:148px;border-radius:50%;border:3px solid var(--green-dark);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;background:radial-gradient(circle at 50% 40%, #fff9ec, var(--paper) 75%);
}
.stamp::before{content:"";position:absolute;inset:7px;border-radius:50%;border:1px dashed var(--gold-dim);}
.stamp .score{font-family:var(--display);font-size:2.35rem;font-weight:700;color:var(--green-dark);line-height:1;}
.stamp .score sub{font-size:0.9rem;font-weight:500;}
.stamp .verdict-tag{font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;margin-top:4px;color:var(--gold-dim);text-align:center;padding:0 8px;}
.stamp.approved{border-color:var(--green-ok);}.stamp.approved .verdict-tag{color:var(--green-ok);}
.stamp.review{border-color:var(--gold-dim);}
.stamp.rejected{border-color:var(--red);}.stamp.rejected .verdict-tag{color:var(--red);}

.pillar-detail{display:flex;flex-direction:column;gap:10px;margin:16px 0;}
.pillar-row .prow-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;}
.pillar-row .pname{font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;color:var(--green-dark);font-size:12px;}
.pillar-row .pval{font-family:var(--mono);color:var(--green-mid);}
.pillar-row .ptrack{height:8px;background:var(--paper-2);border-radius:4px;overflow:hidden;border:1px solid var(--line);}
.pillar-row .pfill{height:100%;background:linear-gradient(90deg, var(--green-mid), var(--gold));}
.pillar-row .pweight{font-size:10.5px;color:var(--ink-soft);margin-top:2px;}

.verdict-text{background:var(--paper-2);border-left:3px solid var(--green-mid);padding:12px 14px;border-radius:4px;font-size:13.5px;line-height:1.55;margin:12px 0;}
.checklist{list-style:none;padding:0;margin:12px 0;}
.checklist li{display:flex;gap:9px;align-items:flex-start;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--paper-3);}
.checklist li:last-child{border-bottom:none;}
.chk-icon{flex:none;width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;margin-top:1px;}
.chk-yes{background:var(--green-ok);color:#fff;}.chk-no{background:var(--red);color:#fff;}

.decisions-recap{font-size:12.5px;color:var(--ink-soft);}
.decisions-recap .drow{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--paper-3);}
.decisions-recap .drow b{color:var(--green-dark);font-weight:600;}

.export-footer{margin-top:14px;padding-top:10px;border-top:1px dashed var(--paper-3);font-family:var(--mono);font-size:9.5px;color:var(--ink-soft);white-space:pre-line;text-align:center;line-height:1.4;}

/* Modal Acervo */
.modal-overlay{position:fixed;inset:0;background:rgba(15,25,20,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal-overlay.hidden{display:none;}
.modal-panel{background:var(--paper);width:100%;max-width:540px;max-height:82vh;border-radius:14px 14px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(0,0,0,.28);}
.modal-head{padding:16px 18px 10px;border-bottom:1px solid var(--line);position:relative;}
.modal-head .icon-btn{position:absolute;right:14px;top:14px;font-size:1.1rem;color:var(--ink-soft);background:none;border:none;cursor:pointer;}
.modal-body{padding:6px 18px 24px;overflow-y:auto;}
.acervo-fase-title{font-family:var(--display);font-size:0.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--green-mid);margin:16px 0 8px;padding-top:8px;border-top:1px solid var(--paper-3);}
.acervo-fase-title:first-child{border-top:none;margin-top:6px;}
.acervo-item{margin-bottom:11px;}

  opcoes: [
    {id:"G_NAT_01",fase:1,ordem:1,texto:"Exploratória",extra:"Quando o tema ainda é pouco conhecido",verso:"Pesquisa Exploratória: visa proporcionar maior familiaridade com o problema, tornando-o mais explícito ou construindo hipóteses. É especialmente útil quando o tema ainda foi pouco estudado ou quando se busca um novo enfoque.",coerencia:0,vies:0,generalizacao:0,feedback:"Você escolheu a natureza exploratória. Ela é adequada quando o problema ainda não está claramente delimitado."},
    {id:"G_NAT_02",fase:1,ordem:2,texto:"Descritiva",extra:"Quando se quer caracterizar um fenômeno",verso:"Pesquisa Descritiva: tem como objetivo descrever as características de determinada população, fenômeno ou estabelecer relações entre variáveis. Não tem o compromisso de explicar as causas, mas de retratar a realidade observada.",coerencia:0,vies:0,generalizacao:0,feedback:"Natureza descritiva escolhida. Boa opção quando o foco é caracterizar, mapear ou traçar o perfil de um fenômeno."},
    {id:"G_NAT_03",fase:1,ordem:3,texto:"Explicativa",extra:"Quando se busca causa e efeito",verso:"Pesquisa Explicativa: tem como propósito identificar os fatores que determinam ou contribuem para a ocorrência dos fenômenos. É a que mais aprofunda o conhecimento da realidade, pois explica a razão e o porquê das coisas.",coerencia:0,vies:0,generalizacao:0,feedback:"Natureza explicativa selecionada. Adequada quando o objetivo é compreender relações de causa e efeito."},
    {id:"G_FIN_01",fase:1,ordem:4,texto:"Básica",extra:"Gerar conhecimento sem aplicação imediata",verso:"Pesquisa Básica (ou fundamental): objetiva gerar novos conhecimentos úteis para o avanço da ciência, sem aplicação prática prevista. Foca no desenvolvimento de teorias e compreensão de fenômenos.",coerencia:0,vies:0,generalizacao:0,feedback:"Finalidade básica escolhida. O foco está na geração de conhecimento teórico."},
    {id:"G_FIN_02",fase:1,ordem:5,texto:"Aplicada",extra:"Resolver problemas concretos",verso:"Pesquisa Aplicada: objetiva gerar conhecimentos para aplicação prática e dirigida à solução de problemas específicos. É orientada para a intervenção e transformação da realidade.",coerencia:0,vies:0,generalizacao:0,feedback:"Finalidade aplicada selecionada. O projeto busca resolver um problema concreto da Educação Física."},
    {id:"G_ABO_01",fase:2,ordem:1,texto:"Quantitativa",extra:"Números, medidas e generalização",verso:"Abordagem Quantitativa: fundamenta-se na mensuração de variáveis e na análise estatística. Privilegia a generalização, a objetividade e o teste de hipóteses. Usa instrumentos padronizados e amostras geralmente maiores.",coerencia:0,vies:0,generalizacao:0,feedback:"Abordagem quantitativa escolhida. Adequada para medir magnitude, comparar grupos e testar hipóteses."},
    {id:"G_ABO_02",fase:2,ordem:2,texto:"Qualitativa",extra:"Significados, processos e compreensão",verso:"Abordagem Qualitativa: centra-se na compreensão dos significados, motivos, aspirações, crenças e valores. O pesquisador é instrumento-chave, o ambiente natural é a fonte direta dos dados e a análise é indutiva.",coerencia:0,vies:0,generalizacao:0,feedback:"Abordagem qualitativa selecionada. Foco na compreensão profunda do fenômeno."},
    {id:"G_ABO_03",fase:2,ordem:3,texto:"Mista",extra:"Combina quanti e quali",verso:"Abordagem Mista (quanti-quali): combina elementos das abordagens quantitativa e qualitativa em um mesmo estudo, buscando complementaridade, triangulação ou expansão da compreensão do problema.",coerencia:0,vies:0,generalizacao:0,feedback:"Abordagem mista escolhida. Exige clareza sobre como as duas vertentes se integram."},
    {id:"G_MET_01",fase:2,ordem:4,texto:"Dedutivo",extra:"Do geral para o particular",verso:"Método Dedutivo: parte de princípios gerais (teorias, leis) e chega a conclusões particulares. É o caminho da demonstração. Muito usado em pesquisas que testam hipóteses derivadas de teorias existentes.",coerencia:0,vies:0,generalizacao:0,feedback:"Método dedutivo selecionado. Você partirá de uma teoria ou framework para testar hipóteses específicas."},
    {id:"G_MET_02",fase:2,ordem:5,texto:"Indutivo",extra:"Do particular para o geral",verso:"Método Indutivo: parte de observações particulares e busca chegar a conclusões gerais ou a novas teorias. É o caminho da descoberta. Comum em pesquisas exploratórias e qualitativas.",coerencia:0,vies:0,generalizacao:0,feedback:"Método indutivo escolhido. Você partirá dos dados para construir compreensões mais amplas."},
    {id:"G_MET_03",fase:2,ordem:6,texto:"Dialético",extra:"Contradições e totalidade",verso:"Método Dialético: considera os fenômenos em constante mudança e inter-relação, enfatizando as contradições internas e a totalidade. Busca compreender a realidade em seu movimento e historicidade.",coerencia:0,vies:0,generalizacao:0,feedback:"Método dialético selecionado. Adequado para análises que consideram contradições e transformação social."},
    {id:"G_MET_04",fase:2,ordem:7,texto:"Fenomenológico",extra:"Essência da experiência vivida",verso:"Método Fenomenológico: busca compreender a essência da experiência vivida pelos sujeitos. Suspende (epoché) as pré-compreensões do pesquisador para acessar o fenômeno como ele se apresenta à consciência.",coerencia:0,vies:0,generalizacao:0,feedback:"Método fenomenológico escolhido. Foco na experiência vivida e em seus significados."},
    {id:"G_TEM_01",fase:3,ordem:1,texto:"Transversal",extra:"Dados coletados em um único momento",verso:"Estudo Transversal (seccional): a coleta de dados ocorre em um único momento no tempo. Permite descrever a situação atual e analisar associações, mas limita a inferência causal por não estabelecer precedência temporal.",coerencia:0,vies:-5,generalizacao:-5,feedback:"Temporalidade transversal escolhida. Adequada para diagnósticos e estudos de prevalência."},
    {id:"G_TEM_02",fase:3,ordem:2,texto:"Longitudinal",extra:"Acompanhamento ao longo do tempo",verso:"Estudo Longitudinal: acompanha os mesmos sujeitos ou a mesma população ao longo de um período. Permite analisar mudanças, trajetórias e, com maior segurança, relações temporais entre variáveis.",coerencia:0,vies:5,generalizacao:0,feedback:"Temporalidade longitudinal selecionada. Fortalece a possibilidade de análises temporais e de mudança."},
    {id:"G_TEM_03",fase:3,ordem:3,texto:"Coorte",extra:"Acompanhamento de grupo com característica comum",verso:"Estudo de Coorte: tipo de estudo longitudinal que acompanha um grupo de pessoas que compartilham uma característica comum (exposição) para observar a ocorrência de desfechos ao longo do tempo.",coerencia:0,vies:5,generalizacao:0,feedback:"Desenho de coorte escolhido. Adequado para investigar incidência e fatores de risco."},
    {id:"G_VAL_01",fase:4,ordem:1,texto:"Priorizar Validade Interna",extra:"Controle de vieses e confusão",verso:"Validade Interna: grau em que os resultados podem ser atribuídos à variável independente (intervenção/exposição) e não a fatores estranhos. Exige controle de variáveis confundidoras, randomização (quando possível) e grupos de comparação adequados.",coerencia:5,vies:10,generalizacao:-3,feedback:"Você priorizou a validade interna. Isso fortalece a confiança de que os resultados realmente se devem ao que foi investigado."},
    {id:"G_VAL_02",fase:4,ordem:2,texto:"Priorizar Validade Externa",extra:"Possibilidade de generalização",verso:"Validade Externa: grau em que os resultados podem ser generalizados para outros sujeitos, contextos ou momentos. Depende da representatividade da amostra, do realismo do cenário e da replicabilidade do estudo.",coerencia:-3,vies:-5,generalizacao:10,feedback:"Você priorizou a validade externa. Isso amplia a possibilidade de aplicar os resultados em outros contextos."},
    {id:"G_VAL_03",fase:4,ordem:3,texto:"Equilíbrio entre Validades",extra:"Buscar o melhor compromisso possível",verso:"Equilíbrio entre Validade Interna e Externa: todo delineamento envolve trade-offs. O pesquisador deve buscar o melhor compromisso possível entre o controle de vieses (interna) e a possibilidade de generalização (externa), de acordo com os objetivos do estudo.",coerencia:5,vies:5,generalizacao:5,feedback:"Escolha equilibrada. Demonstra consciência de que validade interna e externa precisam ser ponderadas conforme o objetivo da pesquisa."}

/* ===================== HELPERS ===================== */
function clamp(n,min,max){return Math.max(min,Math.min(max,Math.round(n)));}
function nomeSubarea(id){const s=DATA.subareas.find(x=>x.id===id);return s?s.nome:'';}
function opcoesPorPrefixo(fase,prefix){return DATA.opcoes.filter(o=>o.fase===fase&&o.id.startsWith(prefix)).sort((a,b)=>a.ordem-b.ordem);}
function findOpt(id){return DATA.opcoes.find(o=>o.id===id);}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.remove('hidden');
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>t.classList.add('hidden'),2600);
}

function calcularRigor(){
  let coerencia=70, vies=70, generalizacao=70;
  const apply=(opt)=>{if(!opt)return;coerencia+=(opt.coerencia||0);vies+=(opt.vies||0);generalizacao+=(opt.generalizacao||0);};
  apply(STATE.fase3.temporalidade);
  apply(STATE.fase4.validade);
  if(STATE.fase3.procedimento && STATE.cenario){
    if(STATE.fase3.procedimento===STATE.cenario.template) coerencia+=12;
    else coerencia-=10;
  }
  Object.values(STATE.fase4.armadilhas).forEach(v=>{vies += v.acertou ? 5 : -5;});
  coerencia=clamp(coerencia,0,100); vies=clamp(vies,0,100); generalizacao=clamp(generalizacao,0,100);
  const final=clamp(coerencia*0.30 + vies*0.40 + generalizacao*0.30,0,100);
  return {coerencia,vies,generalizacao,final};
}
function veredicto(score){
  if(score>=85) return {key:'approved',label:'Aprovado sem ressalvas',texto:DATA.config.parecer_aprovado};
  if(score>=60) return {key:'review',label:'Aprovado com reformulações',texto:DATA.config.parecer_reformulacao};
  return {key:'rejected',label:'Recusado por incoerência grave',texto:DATA.config.parecer_recusado};
}

/* ===================== NAV ===================== */
function goto(screen){STATE.screen=screen;window.scrollTo(0,0);render();}
function iniciarNovo(modo){
  STATE.modo=modo||'classico';
  STATE.subarea=null;STATE.cenario=null;
  STATE.fase1={natureza:null,finalidade:null};
  STATE.fase2={abordagem:null,metodo:null};
  STATE.fase3={procedimento:null,temporalidade:null,viVd:'',amostra:'',controle:''};
  STATE.fase4={validade:null,armadilhas:{}};
  STATE.flipOpen={};STATE.reflexao='';STATE.erroConsecutivo=0;
  goto('subarea');
}

/* ===================== RENDER ===================== */
function render(){
  const app=document.getElementById('app');
  let html='';
  switch(STATE.screen){
    case 'inicio': html=screenInicio(); break;
    case 'subarea': html=screenSubarea(); break;
    case 'cenario': html=screenCenario(); break;
    case 'fase1': html=screenFase1(); break;
    case 'fase2': html=screenFase2(); break;
    case 'fase3': html=screenFase3(); break;
    case 'fase4': html=screenFase4(); break;
    case 'parecer': html=screenParecer(); break;
    default: html=screenInicio();
  }
  app.innerHTML=html;
}

function sessionBar(){
  if(!STATE.cenario) return '';
  const r=calcularRigor();
  const faseIdx={fase1:0,fase2:1,fase3:2,fase4:3,parecer:4}[STATE.screen]??-1;
  const dots=Array.from({length:5},(_,i)=>`<span class="fase-dot ${i<=faseIdx?'on':''}"></span>`).join('');
  const labels={fase1:'Fase 1 · Natureza e Finalidade',fase2:'Fase 2 · Abordagem e Método',fase3:'Fase 3 · Delineamento',fase4:'Fase 4 · Validade e Armadilhas',parecer:'Fase 5 · Parecer Final'};
  return `<div class="session-bar no-print">
    <div class="session-top">
      <div>
        <div class="tag">${STATE.cenario.id} · ${nomeSubarea(STATE.cenario.subarea_id)}</div>
        <div class="fase-label">${labels[STATE.screen]||''}</div>
      </div>
      <button class="acervo-btn" onclick="openAcervo()">Acervo ⌕</button>
    </div>
    <div class="pillars">
      <div class="pillar"><div class="pillar-label"><span>Coerência</span><span>${r.coerencia}%</span></div><div class="pillar-track"><div class="pillar-fill" style="width:${r.coerencia}%"></div></div></div>
      <div class="pillar"><div class="pillar-label"><span>Controle de Viés</span><span>${r.vies}%</span></div><div class="pillar-track"><div class="pillar-fill" style="width:${r.vies}%"></div></div></div>
      <div class="pillar"><div class="pillar-label"><span>Generalização</span><span>${r.generalizacao}%</span></div><div class="pillar-track"><div class="pillar-fill" style="width:${r.generalizacao}%"></div></div></div>
    </div>
    ${faseIdx>=0?`<div class="fase-dots">${dots}</div>`:''}
  </div>`;
}

}

/* ---- EXPANDABLE CARDS ---- */
function flipCard(opt,group,selected){
  const isOpen=!!STATE.flipOpen[opt.id];
  const isSelected=selected&&selected.id===opt.id;
  return `<div class="opt-card ${isOpen?'open':''} ${isSelected?'selected':''}" id="card-${opt.id}">
    <div class="opt-card-head" onclick="toggleFlip('${opt.id}')">
      <div>
        <div class="opt-title">${opt.texto}</div>
        <div class="opt-extra">${opt.extra||''}</div>
      </div>
      <div class="opt-chevron">▼</div>
    </div>
    <div class="opt-card-body">
      <p>${opt.verso}</p>
      <button class="select-btn ${isSelected?'on':''}" onclick="event.stopPropagation();escolherOpcao('${group}','${opt.id}')">${isSelected?'✓ Selecionado':'Selecionar'}</button>
    </div>
  </div>`;
}
function toggleFlip(id){
  STATE.flipOpen[id]=!STATE.flipOpen[id];
  render();
  // After expand, ensure the opened card is fully visible (page scrolls)
  if(STATE.flipOpen[id]){
    requestAnimationFrame(()=>{
      const el=document.getElementById('card-'+id);
      if(el) el.scrollIntoView({behavior:'smooth', block:'nearest'});
    });
  }
}
function escolherOpcao(group,id){
  const opt=findOpt(id);
  if(group==='natureza') STATE.fase1.natureza=opt;
  if(group==='finalidade') STATE.fase1.finalidade=opt;
  if(group==='abordagem') STATE.fase2.abordagem=opt;
  if(group==='metodo') STATE.fase2.metodo=opt;
  if(group==='temporalidade') STATE.fase3.temporalidade=opt;
  if(group==='validade') STATE.fase4.validade=opt;
  // Keep the selected card open so the user sees confirmation
  STATE.flipOpen[id]=true;
  render();
}

/* ---- ACERVO ---- */
function openAcervo(){
  const body=document.getElementById('acervoBody');
  const grupos=[
    ['Fase 1 — Natureza', opcoesPorPrefixo(1,'G_NAT')],
    ['Fase 1 — Finalidade', opcoesPorPrefixo(1,'G_FIN')],
    ['Fase 2 — Abordagem', opcoesPorPrefixo(2,'G_ABO')],
    ['Fase 2 — Método', opcoesPorPrefixo(2,'G_MET')],
    ['Fase 3 — Procedimentos', DATA.procedimentos.map(p=>({texto:p.nome,verso:p.desc}))],
    ['Fase 3 — Temporalidade', opcoesPorPrefixo(3,'G_TEM')],
    ['Fase 4 — Validade', opcoesPorPrefixo(4,'G_VAL')]
  ];
  body.innerHTML=grupos.map(([titulo,opts])=>`
    <div class="acervo-fase-title">${titulo}</div>
    ${opts.map(o=>`<div class="acervo-item"><div class="aname">${o.texto||o.nome}</div><p>${o.verso||o.desc||''}</p></div>`).join('')}
  `).join('');
  document.getElementById('acervoModal').classList.remove('hidden');
}
function closeAcervo(){document.getElementById('acervoModal').classList.add('hidden');}

/* INIT */
render();
</script>
