<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Laboratório do Pesquisador – Delineamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  /* Paleta idêntica à versão Claude (Protótipo 2) */
  --ink: #1c2620;
  --ink-soft: #3b453d;
  --green-dark: #0f2e24;   /* forest-deep */
  --green-mid: #1e4a3a;    /* forest */
  --green-ok: #2c6349;     /* forest-mid */
  --forest-light: #4c8266;
  --paper: #f3ede0;
  --paper-2: #eae1c8;
  --paper-3: #ddd0ab;
  --line: #c9b98c;
  --gold: #b6893a;
  --gold-soft: #dcae5b;    /* gold-light */
  --gold-dim: #9c7936;
  --red: #8f3b2e;
  --shadow: 0 10px 30px rgba(15,46,36,0.18);
  --display: 'Oswald', "Arial Narrow", sans-serif;
  --body: 'Lora', Georgia, serif;
  --mono: 'IBM Plex Mono', "Courier New", monospace;
  --radius: 4px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:var(--body);
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 20% -10%, rgba(182,137,58,0.10), transparent 60%),
    var(--paper);
  min-height:100vh;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:540px;margin:0 auto;min-height:100vh;padding-bottom:32px;position:relative;}

/* Brand = masthead Claude */
.brand{
  display:flex;justify-content:space-between;align-items:flex-end;
  padding:22px 16px 20px;margin-bottom:0;
  background:linear-gradient(180deg, var(--green-dark), var(--green-mid) 65%, var(--green-ok));
  color:var(--paper);
  border-bottom:3px solid var(--gold);
  position:relative;
  overflow:hidden;
}
.brand::before{
  content:"";
  position:absolute;inset:0;
  background-image:repeating-linear-gradient(115deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 26px);
  pointer-events:none;
}
.brand-name{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-soft);position:relative;}
.brand-title{font-family:var(--display);font-size:1.28rem;font-weight:700;color:var(--paper);position:relative;}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.04em;
  padding:14px 18px;border:none;border-radius:8px;cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  text-align:center;position:relative;
}
.btn-primary{
  background:linear-gradient(180deg, var(--green-ok) 0%, var(--green-dark) 100%);
  color:var(--paper);
  box-shadow:
    0 1px 0 rgba(255,255,255,.18) inset,
    0 5px 0 #0a1f18,
    0 10px 20px rgba(15,46,36,.35);
}
.btn-primary:hover{background:linear-gradient(180deg, #3a7556 0%, var(--green-mid) 100%);}
.btn-primary:active{
  transform:translateY(4px);
  box-shadow:
    0 1px 0 rgba(255,255,255,.1) inset,
    0 1px 0 #0a1f18,
    0 3px 8px rgba(15,46,36,.22);
}
.btn-secondary{
  background:linear-gradient(180deg, #fffef9 0%, var(--paper) 55%, var(--paper-2) 100%);
  color:var(--green-dark);
  border:1.5px solid rgba(15,46,36,.2);
  box-shadow:
    0 1px 0 rgba(255,255,255,.85) inset,
    0 4px 0 rgba(15,46,36,.16),
    0 8px 16px rgba(15,46,36,.12);
}
.btn-secondary:hover{background:linear-gradient(180deg, #fff 0%, var(--paper) 100%);}
.btn-secondary:active{
  transform:translateY(3px);
  box-shadow:
    0 1px 0 rgba(255,255,255,.55) inset,
    0 1px 0 rgba(15,46,36,.12),
    0 3px 8px rgba(15,46,36,.1);
}
.btn-gold{
  background:linear-gradient(180deg, var(--gold-soft) 0%, var(--gold) 55%, var(--gold-dim) 100%);
  color:var(--green-dark);font-weight:700;
  box-shadow:
    0 1px 0 rgba(255,255,255,.45) inset,
    0 5px 0 #7a5a22,
    0 10px 18px rgba(182,137,58,.35);
}
.btn-gold:hover{background:linear-gradient(180deg, #e8cd93 0%, var(--gold-soft) 50%, var(--gold) 100%);}
.btn-gold:active{
  transform:translateY(4px);
  box-shadow:
    0 1px 0 rgba(255,255,255,.3) inset,
    0 1px 0 #7a5a22,
    0 3px 8px rgba(182,137,58,.25);
}
.btn-ghost{background:transparent;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;width:auto;padding:8px 4px;font-size:11.5px;box-shadow:none;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-block{width:100%;}
.btn-row{display:flex;gap:10px;margin-top:14px;}
.btn-row .btn{flex:1;}

/* Cards & layout */
.section{padding:12px 16px 20px;}
.card{
  background:linear-gradient(180deg, #fffef9 0%, var(--paper) 55%, var(--paper-2) 100%);
  border-radius:10px;padding:16px;margin-bottom:12px;
  border:1.5px solid rgba(15,46,36,.12);
  box-shadow:
    0 1px 0 rgba(255,255,255,.8) inset,
    0 4px 0 rgba(15,46,36,.1),
    0 10px 22px rgba(15,46,36,.12);
}
.muted{color:var(--ink-soft);font-size:13px;}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7a5721;display:block;margin-bottom:4px;}

/* Home */
.home-hero{text-align:center;padding:22px 10px 14px;}
.home-hero h1{font-family:var(--display);font-size:1.65rem;color:var(--green-dark);line-height:1.15;}
.home-hero p{font-size:14px;color:var(--ink-soft);margin-top:8px;}
.home-actions{display:flex;flex-direction:column;gap:10px;margin-top:18px;}

/* Subarea grid */
.subarea-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.subarea-btn{
  background:linear-gradient(165deg, #fffef9 0%, var(--paper) 100%);
  border:1.5px solid rgba(24,72,52,.12);
  border-radius:10px;padding:14px 10px;text-align:left;cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  font-family:var(--body);color:var(--ink);
  box-shadow:
    0 1px 0 rgba(255,255,255,.7) inset,
    0 3px 0 rgba(18,59,41,.1),
    0 6px 14px rgba(29,50,39,.1);
}
.subarea-btn:hover{
  border-color:var(--gold);
  transform:translateY(-2px);
  box-shadow:
    0 1px 0 rgba(255,255,255,.8) inset,
    0 4px 0 rgba(18,59,41,.12),
    0 10px 22px rgba(29,50,39,.14);
}
.subarea-btn:active{
  transform:translateY(1px);
  box-shadow:
    0 1px 0 rgba(255,255,255,.5) inset,
    0 1px 0 rgba(18,59,41,.1),
    0 3px 8px rgba(29,50,39,.08);
}
.subarea-btn .num{font-family:var(--mono);font-size:10px;color:var(--gold);letter-spacing:.08em;}
.subarea-btn .nome{font-family:var(--display);font-size:13.5px;font-weight:600;color:var(--green-dark);margin-top:3px;line-height:1.25;}

/* Session / rigor bar (sticky) */
.session-bar{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg, var(--green-dark), var(--green-mid));
  color:var(--paper);padding:10px 14px 12px;border-bottom:2px solid var(--gold);
}
.session-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.session-top .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-soft);}
.session-top .fase-label{font-family:var(--display);font-size:0.9rem;letter-spacing:.04em;}
.pillars{display:flex;gap:7px;}
.pillar{flex:1;}
.pillar-label{font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;color:rgba(243,235,212,.75);margin-bottom:3px;display:flex;justify-content:space-between;}
.pillar-track{height:5px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden;}
.pillar-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .45s ease;}
/* Timeline + lupa 3D */
.timeline{
  display:grid;grid-template-columns:repeat(5,1fr);
  align-items:center;margin-top:14px;padding:10px 0 8px;position:relative;
}
.timeline-track{
  position:absolute;left:10%;right:10%;top:50%;height:2px;
  background:rgba(255,255,255,.16);transform:translateY(-50%);z-index:0;
}
.timeline-step{
  position:relative;z-index:1;
  width:26px;height:26px;margin:0 auto;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;font-weight:600;
  color:rgba(243,235,212,.45);border-radius:50%;
  background:rgba(15,40,28,.4);
  border:1.5px solid rgba(255,255,255,.14);
  transition:all .25s ease;
}
.timeline-step.done{
  color:var(--gold-soft);border-color:var(--gold-dim);
  background:rgba(182,137,58,.22);
}
.timeline-cell{position:relative;display:flex;align-items:center;justify-content:center;min-height:56px;}
/* Lupa 3D envolvendo o número atual */
.lupa-3d{
  position:relative;z-index:4;
  width:56px;height:56px;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.45));
}
/* Aro: centro em (21,21), raio 19 */
.lupa-rim{
  position:absolute;left:2px;top:2px;
  width:38px;height:38px;border-radius:50%;
  background:
    radial-gradient(circle at 32% 28%, #f5e6c0 0%, #dcae5b 38%, #b6893a 62%, #7a5a22 100%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.55) inset,
    0 -2px 4px rgba(0,0,0,.25) inset,
    0 3px 0 rgba(90,60,15,.35);
}
.lupa-glass{
  position:absolute;left:7px;top:7px;
  width:28px;height:28px;border-radius:50%;
  background:
    radial-gradient(circle at 30% 25%, rgba(255,255,255,.55) 0%, rgba(255,255,255,.08) 35%, rgba(15,46,36,.15) 100%),
    linear-gradient(160deg, #f3ede0 0%, #e8d9a8 100%);
  box-shadow:
    0 0 0 1.5px rgba(90,60,15,.35) inset,
    0 2px 4px rgba(0,0,0,.2) inset;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.lupa-glass::before{
  content:"";position:absolute;left:4px;top:3px;
  width:12px;height:8px;border-radius:50%;
  background:rgba(255,255,255,.45);
  transform:rotate(-25deg);
}
.lupa-num{
  position:relative;z-index:1;
  font-family:var(--mono);font-size:14px;font-weight:700;
  color:var(--green-dark);line-height:1;
}
/* Cabo ancorado na borda SE do aro (45°), saindo radialmente */
.lupa-handle{
  position:absolute;
  /* ponto de ancoragem no aro: centro(21,21) + 19*cos45 ≈ (34.4, 34.4) */
  left:34px;top:34px;
  width:20px;height:5px;
  border-radius:2.5px;
  background:linear-gradient(180deg, #e8cd93 0%, #b6893a 40%, #8a6828 100%);
  /* origin no início do cabo (junto ao aro); 45° = direção SE */
  transform-origin:0 50%;
  transform:rotate(45deg);
  box-shadow:
    0 1px 0 rgba(255,255,255,.35) inset,
    0 2px 3px rgba(0,0,0,.35);
}
.lupa-handle::before{
  /* junção no aro */
  content:"";position:absolute;left:-3px;top:50%;
  width:8px;height:8px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #f0d78a, #a67c28 70%);
  transform:translateY(-50%);
  box-shadow:0 1px 2px rgba(0,0,0,.3);
}
.lupa-handle::after{
  /* ponta do cabo */
  content:"";position:absolute;right:-2px;top:50%;
  width:6px;height:6px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #e8cd93, #8a6828 75%);
  transform:translateY(-50%);
  box-shadow:0 1px 2px rgba(0,0,0,.3);
}
.brand{gap:12px;align-items:flex-end;}
.brand-figure{
  flex:none;width:70px;height:108px;position:relative;z-index:1;
  display:flex;align-items:flex-end;justify-content:center;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));
}
.brand-figure img{
  max-width:100%;max-height:100%;width:auto;height:100%;
  object-fit:contain;object-position:bottom center;display:block;
}
.acervo-btn{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  background:transparent;border:1px solid var(--gold-dim);color:var(--gold-soft);
  border-radius:3px;padding:5px 9px;cursor:pointer;
}

/* Scenario */
.scenario-box{
  background:linear-gradient(165deg, #fffef9 0%, var(--paper) 100%);
  border-radius:10px;padding:16px;margin-bottom:12px;
  border:1px solid rgba(24,72,52,.1);border-left:4px solid var(--gold);
  box-shadow:
    0 1px 0 rgba(255,255,255,.65) inset,
    0 2px 4px rgba(29,50,39,.06),
    0 8px 20px rgba(29,50,39,.12);
}
.scenario-box h3{font-family:var(--display);font-size:1.08rem;color:var(--green-dark);margin-bottom:8px;text-transform:none;letter-spacing:0;}
.scenario-box p{font-size:13.5px;margin-bottom:8px;}
.scenario-box .pergunta{font-style:italic;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:8px;margin-top:6px;}
.level-chip{
  font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;
  padding:3px 8px;border-radius:10px;border:1px solid currentColor;display:inline-block;
}
.lvl-facil{color:#3f7a5f;}.lvl-medio{color:var(--gold-dim);}.lvl-dificil{color:var(--red);}

/* Orientador — foto circular, sem aro */
.orientador{
  display:flex;gap:12px;align-items:center;
  background:rgba(18,59,41,.07);border-radius:var(--radius);padding:12px 14px;margin:12px 0;
  border-left:3px solid var(--gold);
}
.orientador.warn{background:rgba(158,43,46,.08);border-left-color:var(--red);}
.orientador-avatar{
  flex:none;width:56px;height:56px;
  border:none;
  box-shadow:none;
  border-radius:50%;
  overflow:hidden;
  background:transparent;
  flex-shrink:0;
}
.orientador-avatar img{
  width:100%;height:100%;
  object-fit:contain;
  object-position:center center;
  display:block;
}
.orientador-name{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--gold-dim);margin-bottom:3px;}
.orientador-text{font-size:13px;line-height:1.5;color:var(--ink);}

/* Expandable theory cards — mesma profundidade 3D dos botões */
.flip-grid{display:flex;flex-direction:column;gap:14px;margin:10px 0;}
.opt-card{
  background:linear-gradient(180deg, #fffef9 0%, var(--paper) 50%, var(--paper-2) 100%);
  border:1.5px solid rgba(15,46,36,.16);
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  box-shadow:
    0 1px 0 rgba(255,255,255,.9) inset,
    0 5px 0 rgba(15,46,36,.16),
    0 10px 20px rgba(15,46,36,.14);
}
.opt-card:active{
  transform:translateY(4px);
  box-shadow:
    0 1px 0 rgba(255,255,255,.55) inset,
    0 1px 0 rgba(15,46,36,.12),
    0 3px 8px rgba(15,46,36,.1);
}
.opt-card.open{
  border-color:rgba(15,46,36,.22);
  box-shadow:
    0 1px 0 rgba(255,255,255,.85) inset,
    0 6px 0 rgba(15,46,36,.18),
    0 14px 28px rgba(15,46,36,.18);
}
.opt-card.selected{
  border-color:var(--gold);
  background:linear-gradient(180deg, #fff9e8 0%, #f3e6bf 55%, #e8d49a 100%);
  box-shadow:
    0 0 0 2px rgba(220,174,91,.45),
    0 1px 0 rgba(255,255,255,.85) inset,
    0 5px 0 rgba(122,90,34,.35),
    0 12px 24px rgba(15,46,36,.16);
}
.opt-card-head{
  padding:14px 16px;
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
}
.opt-card .opt-title{font-family:var(--display);font-size:15px;font-weight:600;color:var(--green-dark);line-height:1.25;}
.opt-card .opt-extra{font-size:12px;color:var(--ink-soft);margin-top:3px;}
.opt-card .opt-chevron{
  font-family:var(--mono);font-size:11px;color:var(--gold-dim);
  flex:none;padding:2px 0;transition:transform .2s ease;
}
.opt-card.open .opt-chevron{transform:rotate(180deg);}
.opt-card-body{
  display:none;
  padding:0 16px 16px;
  border-top:1px solid rgba(24,72,52,.08);
  background:rgba(18,59,41,.03);
}
.opt-card.open .opt-card-body{display:block;}
.opt-card-body p{
  font-size:13px;line-height:1.55;color:var(--ink);
  margin:12px 0 14px;
}
.opt-card .select-btn{
  display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
  background:linear-gradient(180deg, var(--gold-soft) 0%, var(--gold) 55%, var(--gold-dim) 100%);
  color:var(--green-dark);padding:9px 14px;border-radius:6px;border:none;font-weight:600;cursor:pointer;
  box-shadow:
    0 1px 0 rgba(255,255,255,.4) inset,
    0 4px 0 #7a5a22,
    0 6px 12px rgba(182,137,58,.3);
  transition:transform .12s ease, box-shadow .12s ease;
}
.opt-card .select-btn:active{
  transform:translateY(3px);
  box-shadow:
    0 1px 0 rgba(255,255,255,.25) inset,
    0 1px 0 #7a5a22,
    0 2px 6px rgba(182,137,58,.22);
}
.opt-card .select-btn.on{
  background:linear-gradient(180deg, var(--green-ok) 0%, var(--green-dark) 100%);
  color:var(--paper);
  box-shadow:
    0 1px 0 rgba(255,255,255,.14) inset,
    0 4px 0 #0a1f18,
    0 6px 12px rgba(15,46,36,.28);
}

/* Phase 3 choice tiles */
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;}
.choice-tile{
  border:1.5px solid rgba(15,46,36,.16);border-radius:12px;padding:14px 12px;text-align:left;
  background:linear-gradient(180deg, #fffef9 0%, var(--paper) 50%, var(--paper-2) 100%);
  cursor:pointer;transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  box-shadow:
    0 1px 0 rgba(255,255,255,.9) inset,
    0 5px 0 rgba(15,46,36,.16),
    0 10px 18px rgba(15,46,36,.12);
}
.choice-tile:active{
  transform:translateY(4px);
  box-shadow:
    0 1px 0 rgba(255,255,255,.55) inset,
    0 1px 0 rgba(15,46,36,.12),
    0 3px 8px rgba(15,46,36,.1);
}
.choice-tile.on{
  border-color:var(--gold);
  background:linear-gradient(180deg, #fff9e8 0%, #f3e6bf 55%, #e8d49a 100%);
  box-shadow:
    0 0 0 2px rgba(220,174,91,.45),
    0 1px 0 rgba(255,255,255,.85) inset,
    0 5px 0 rgba(122,90,34,.35),
    0 10px 20px rgba(15,46,36,.14);
}
.choice-tile .cname{font-family:var(--display);font-size:14px;color:var(--green-dark);font-weight:600;}
.choice-tile .cdesc{font-size:11.5px;color:var(--ink-soft);margin-top:3px;line-height:1.35;}

/* Form fields */
.field{margin-bottom:12px;}
.field label{display:block;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--green-mid);margin-bottom:5px;}
.field textarea,.field input[type=text]{
  width:100%;font-family:var(--body);font-size:13.5px;padding:10px 12px;
  border:1.5px solid var(--line);border-radius:6px;background:#fffef9;color:var(--ink);resize:vertical;
}
.field textarea{min-height:68px;}
.hint{font-size:12px;color:var(--ink-soft);margin-top:3px;}

/* Armadilhas */
.quiz-item{
  border:1px solid rgba(24,72,52,.1);border-radius:10px;padding:14px;margin-bottom:12px;
  background:linear-gradient(165deg, #fffef9 0%, var(--paper) 100%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.65) inset,
    0 2px 4px rgba(29,50,39,.05),
    0 6px 14px rgba(29,50,39,.09);
}
.quiz-item p.stmt{font-style:italic;color:var(--green-dark);margin-bottom:10px;font-size:13.5px;}
.quiz-btns{display:flex;gap:8px;}
.quiz-btn{
  flex:1;border:1.5px solid rgba(18,59,41,.25);border-radius:7px;padding:11px 8px;
  font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;

  opcoes: [
    {id:"G_NAT_01",fase:1,ordem:1,texto:"Exploratória",extra:"Quando o tema ainda é pouco conhecido",verso:"Pesquisa Exploratória: visa proporcionar maior familiaridade com o problema, tornando-o mais explícito ou construindo hipóteses. É especialmente útil quando o tema ainda foi pouco estudado ou quando se busca um novo enfoque.",coerencia:0,vies:0,generalizacao:0,feedback:"Você escolheu a natureza exploratória. Ela é adequada quando o problema ainda não está claramente delimitado."},
    {id:"G_NAT_02",fase:1,ordem:2,texto:"Descritiva",extra:"Quando se quer caracterizar um fenômeno",verso:"Pesquisa Descritiva: tem como objetivo descrever as características de determinada população, fenômeno ou estabelecer relações entre variáveis. Não tem o compromisso de explicar as causas, mas de retratar a realidade observada.",coerencia:0,vies:0,generalizacao:0,feedback:"Natureza descritiva escolhida. Boa opção quando o foco é caracterizar, mapear ou traçar o perfil de um fenômeno."},
    {id:"G_NAT_03",fase:1,ordem:3,texto:"Explicativa",extra:"Quando se busca causa e efeito",verso:"Pesquisa Explicativa: tem como propósito identificar os fatores que determinam ou contribuem para a ocorrência dos fenômenos. É a que mais aprofunda o conhecimento da realidade, pois explica a razão e o porquê das coisas.",coerencia:0,vies:0,generalizacao:0,feedback:"Natureza explicativa selecionada. Adequada quando o objetivo é compreender relações de causa e efeito."},
    {id:"G_FIN_01",fase:1,ordem:4,texto:"Básica",extra:"Gerar conhecimento sem aplicação imediata",verso:"Pesquisa Básica (ou fundamental): objetiva gerar novos conhecimentos úteis para o avanço da ciência, sem aplicação prática prevista. Foca no desenvolvimento de teorias e compreensão de fenômenos.",coerencia:0,vies:0,generalizacao:0,feedback:"Finalidade básica escolhida. O foco está na geração de conhecimento teórico."},
    {id:"G_FIN_02",fase:1,ordem:5,texto:"Aplicada",extra:"Resolver problemas concretos",verso:"Pesquisa Aplicada: objetiva gerar conhecimentos para aplicação prática e dirigida à solução de problemas específicos. É orientada para a intervenção e transformação da realidade.",coerencia:0,vies:0,generalizacao:0,feedback:"Finalidade aplicada selecionada. O projeto busca resolver um problema concreto da Educação Física."},
    {id:"G_ABO_01",fase:2,ordem:1,texto:"Quantitativa",extra:"Números, medidas e generalização",verso:"Abordagem Quantitativa: fundamenta-se na mensuração de variáveis e na análise estatística. Privilegia a generalização, a objetividade e o teste de hipóteses. Usa instrumentos padronizados e amostras geralmente maiores.",coerencia:0,vies:0,generalizacao:0,feedback:"Abordagem quantitativa escolhida. Adequada para medir magnitude, comparar grupos e testar hipóteses."},
    {id:"G_ABO_02",fase:2,ordem:2,texto:"Qualitativa",extra:"Significados, processos e compreensão",verso:"Abordagem Qualitativa: centra-se na compreensão dos significados, motivos, aspirações, crenças e valores. O pesquisador é instrumento-chave, o ambiente natural é a fonte direta dos dados e a análise é indutiva.",coerencia:0,vies:0,generalizacao:0,feedback:"Abordagem qualitativa selecionada. Foco na compreensão profunda do fenômeno."},
    {id:"G_ABO_03",fase:2,ordem:3,texto:"Mista",extra:"Combina quanti e quali",verso:"Abordagem Mista (quanti-quali): combina elementos das abordagens quantitativa e qualitativa em um mesmo estudo, buscando complementaridade, triangulação ou expansão da compreensão do problema.",coerencia:0,vies:0,generalizacao:0,feedback:"Abordagem mista escolhida. Exige clareza sobre como as duas vertentes se integram."},

    {id:"G_VAL_01",fase:4,ordem:1,texto:"Priorizar Validade Interna",extra:"Controle de vieses e confusão",verso:"Validade Interna: grau em que os resultados podem ser atribuídos à variável independente (intervenção/exposição) e não a fatores estranhos. Exige controle de variáveis confundidoras, randomização (quando possível) e grupos de comparação adequados.",coerencia:5,vies:10,generalizacao:-3,feedback:"Você priorizou a validade interna. Isso fortalece a confiança de que os resultados realmente se devem ao que foi investigado."},

function clamp(n,min,max){return Math.max(min,Math.min(max,Math.round(n)));}
function nomeSubarea(id){const s=DATA.subareas.find(x=>x.id===id);return s?s.nome:'';}
function opcoesPorPrefixo(fase,prefix){return DATA.opcoes.filter(o=>o.fase===fase&&o.id.startsWith(prefix)).sort((a,b)=>a.ordem-b.ordem);}
function findOpt(id){return DATA.opcoes.find(o=>o.id===id);}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.remove('hidden');
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>t.classList.add('hidden'),2600);
}

function calcularRigor(){
  let coerencia=70, vies=70, generalizacao=70;
  const apply=(opt)=>{if(!opt)return;coerencia+=(opt.coerencia||0);vies+=(opt.vies||0);generalizacao+=(opt.generalizacao||0);};
  apply(STATE.fase3.temporalidade);
  apply(STATE.fase4.validade);
  if(STATE.fase3.procedimento && STATE.cenario){
    if(STATE.fase3.procedimento===STATE.cenario.template) coerencia+=12;
    else coerencia-=10;
  }
  Object.values(STATE.fase4.armadilhas).forEach(v=>{vies += v.acertou ? 5 : -5;});
  coerencia=clamp(coerencia,0,100); vies=clamp(vies,0,100); generalizacao=clamp(generalizacao,0,100);
  const final=clamp(coerencia*0.30 + vies*0.40 + generalizacao*0.30,0,100);
  return {coerencia,vies,generalizacao,final};
}
function veredicto(score){
  if(score>=85) return {key:'approved',label:'Aprovado sem ressalvas',texto:DATA.config.parecer_aprovado};
  if(score>=60) return {key:'review',label:'Aprovado com reformulações',texto:DATA.config.parecer_reformulacao};
  return {key:'rejected',label:'Recusado por incoerência grave',texto:DATA.config.parecer_recusado};
}

/* ===================== NAV ===================== */
function goto(screen){
  STATE.screen=screen;
  window.scrollTo(0,0);
  render();
  try{ sincronizarFaseAlunoFB(screen); }catch(e){ console.error(e); }
}

function sincronizarFaseAlunoFB(screen){
  const a = STATE.alunoSessao;
  if(!a || !a.codigo || !a.alunoId) return;
  if(!window.LabFB) return;
  let fase = screen;
  let faseNome = screen;
  let progresso = 0;
  let status = 'andamento';
  if(typeof STEP_META !== 'undefined' && STEP_META[screen]){
    faseNome = STEP_META[screen].label;
    progresso = STEP_META[screen].n || 0;
  } else if(screen === 'subarea' || screen === 'cenario'){
    faseNome = screen === 'subarea' ? 'Subárea' : 'Cenário';
    progresso = 0;
    status = 'andamento';
  } else if(screen === 'inicio'){
    return; // não sobrescreve
  } else if(screen === 'parecer'){
    faseNome = 'Parecer Final';
    progresso = 10;
    status = 'andamento';
  }
  if(screen === 'parecer'){
    status = 'concluiu';
    faseNome = 'Parecer Final';
    progresso = 10;
    // envio automático do relatório
    setTimeout(function(){ enviarRelatorioAlunoFB(); }, 300);
  }
  window.LabFB.atualizarAluno(a.codigo, a.alunoId, {
    fase: fase,
    faseNome: faseNome,
    progresso: progresso,
    status: status
  }).catch(function(e){ console.error('sync fase', e); });
}

function enviarRelatorioAlunoFB(){
  const a = STATE.alunoSessao;
  if(!a || !a.codigo || !a.alunoId || !window.LabFB) return;
  if(typeof calcularRigor !== 'function' || typeof montarDescricaoMetodo !== 'function') return;
  try{
    const r = calcularRigor();
    const descricao = montarDescricaoMetodo();
    // Guarda texto + id + verso para o relatório do orientador poder reabrir a teoria
    function packOpt(o){
      if(!o) return '';
      if(typeof o === 'string') return o;
      return { id: o.id||'', texto: o.texto||o.nome||'', verso: o.verso||o.desc||'' };
    }
    const escolhas = {
      natureza: packOpt(STATE.fase1 && STATE.fase1.natureza),
      finalidade: packOpt(STATE.fase1 && STATE.fase1.finalidade),
      abordagem: packOpt(STATE.fase2 && STATE.fase2.abordagem),
      metodo: packOpt(STATE.fase2 && STATE.fase2.metodo),
      procedimento: STATE.fase3 ? (STATE.fase3.procedimento||'') : '',
      temporalidade: packOpt(STATE.fase3 && STATE.fase3.temporalidade),
      amostra: STATE.fase3 ? (STATE.fase3.amostra||'') : '',
      viVd: STATE.fase3 ? (STATE.fase3.viVd||'') : '',
      controle: STATE.fase3 ? (STATE.fase3.controle||'') : ''
    };
    window.LabFB.atualizarAluno(a.codigo, a.alunoId, {
      status: 'concluiu',
      fase: 'parecer',
      faseNome: 'Parecer Final',
      progresso: 10,
      scores: { coerencia: r.coerencia, vies: r.vies, generalizacao: r.generalizacao, final: r.final },
      escolhas: escolhas,
      relatorioTexto: descricao
    }).catch(function(e){ console.error('envio relatorio', e); });
  }catch(e){ console.error(e); }
}


function iniciarNovo(modo){
  STATE.modo=modo||'classico';
  STATE.subarea=null;STATE.cenario=null;
  STATE.fase1={natureza:null,finalidade:null};
  STATE.fase2={abordagem:null,metodo:null};
  STATE.fase3={procedimento:null,temporalidade:null,viVd:'',amostra:'',controle:''};
  STATE.fase4={validade:null,armadilhas:{}};
  STATE.flipOpen={};STATE.reflexao='';STATE.erroConsecutivo=0;
  goto('subarea');
}

/* ===================== RENDER ===================== */
function render(){
  const app=document.getElementById('app');
  let html='';
  switch(STATE.screen){
    case 'inicio': html=screenInicio(); break;
    case 'sobre': html=screenSobre(); break;
    case 'orientador': html=screenOrientador(); break;
    case 'entrarSala': html=screenEntrarSala(); break;
    case 'entrarSalaDados': html=screenEntrarSalaDados(); break;
    case 'subarea': html=screenSubarea(); break;
    case 'cenario': html=screenCenario(); break;
    case 'fase1a': html=screenFase1a(); break;
    case 'fase1b': html=screenFase1b(); break;
    case 'fase2a': html=screenFase2a(); break;
    case 'fase2b': html=screenFase2b(); break;
    case 'fase3a': html=screenFase3a(); break;
    case 'fase3b': html=screenFase3b(); break;
    case 'fase3c': html=screenFase3c(); break;
    case 'fase4a': html=screenFase4a(); break;
    case 'fase4b': html=screenFase4b(); break;
    case 'parecer': html=screenParecer(); break;
    default: html=screenInicio();
  }
  app.innerHTML=html;
}

/* 10 etapas reais; janela visível de 5 (1–5 ou 6–10) */
const STEP_META = {
  fase1a: {n:1,  label:'Natureza da Pesquisa'},
  fase1b: {n:2,  label:'Finalidade da Pesquisa'},
  fase2a: {n:3,  label:'Abordagem'},
  fase2b: {n:4,  label:'Método Científico'},
  fase3a: {n:5,  label:'Procedimento Técnico'},
  fase3b: {n:6,  label:'Temporalidade'},
  fase3c: {n:7,  label:'Variáveis e Controle'},
  fase4a: {n:8,  label:'Prioridade de Validade'},
  fase4b: {n:9,  label:'Armadilhas Metodológicas'},
  parecer:{n:10, label:'Parecer Final'}
};

function timelineHtml(stepN){
  if(!stepN || stepN<1) return '';
  const windowStart = stepN <= 5 ? 1 : 6;
  const nums = [0,1,2,3,4].map(i => windowStart + i);
  const cells = nums.map(num => {
    if(num === stepN){
      return `<div class="timeline-cell">
        <div class="lupa-3d" aria-hidden="true">
          <div class="lupa-rim"></div>
          <div class="lupa-glass"><span class="lupa-num">${num}</span></div>
          <div class="lupa-handle"></div>
        </div>
      </div>`;
    }
    const cls = num < stepN ? 'done' : '';
    return `<div class="timeline-cell"><div class="timeline-step ${cls}">${num}</div></div>`;
  }).join('');
  return `<div class="timeline">
    <div class="timeline-track"></div>
    ${cells}
  </div>`;
}

function sessionBar(){
  if(!STATE.cenario) return '';
  const r=calcularRigor();
  const meta = STEP_META[STATE.screen];
  const stepN = meta ? meta.n : 0;
  const label = meta ? meta.label : '';
  return `<div class="session-bar no-print">
    <div class="session-top">
      <div>
        <div class="tag">${STATE.cenario.id} · ${nomeSubarea(STATE.cenario.subarea_id)} · Etapa ${stepN||'—'}/10</div>
        <div class="fase-label">${label}</div>
      </div>
      <button class="acervo-btn" onclick="openAcervo()">Acervo ⌕</button>
    </div>
    <div class="pillars">
      <div class="pillar"><div class="pillar-label"><span>Coerência</span><span>${r.coerencia}%</span></div><div class="pillar-track"><div class="pillar-fill" style="width:${r.coerencia}%"></div></div></div>
      <div class="pillar"><div class="pillar-label"><span>Controle de Viés</span><span>${r.vies}%</span></div><div class="pillar-track"><div class="pillar-fill" style="width:${r.vies}%"></div></div></div>
      <div class="pillar"><div class="pillar-label"><span>Generalização</span><span>${r.generalizacao}%</span></div><div class="pillar-track"><div class="pillar-fill" style="width:${r.generalizacao}%"></div></div></div>
    </div>
    ${stepN ? timelineHtml(stepN) : ''}
  </div>`;
}

function abrirModalSenhaOrientador(){
  if(document.getElementById('modalSenhaOrientador')) return;
  const wrap = document.createElement('div');
  wrap.id = 'modalSenhaOrientador';
  wrap.className = 'modal-senha-backdrop';
  wrap.innerHTML = `
    <div class="modal-senha" role="dialog" aria-modal="true" aria-labelledby="tituloSenhaOr">
      <h3 id="tituloSenhaOr">Módulo do Orientador</h3>
      <p>Área restrita. Digite a senha de acesso.</p>

        <button class="btn btn-secondary" type="button" onclick="fecharModalSenhaOrientador()">Cancelar</button>
        <button class="btn btn-primary" type="button" onclick="validarSenhaOrientador()">Entrar</button>
      </div>
    </div>`;

function gerarCodigoSessao(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = '';
  for(let i=0;i<6;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}

function linkSessaoAluno(codigo){
  const u = new URL(window.location.href);
  u.searchParams.set('sala', codigo);
  // remove hash se houver
  u.hash = '';
  return u.toString();
}

function criarSessaoLocal(){
  const codigo = gerarCodigoSessao();
  STATE.sessaoOrientador = {
    codigo,
    criadaEm: Date.now(),
    link: linkSessaoAluno(codigo),
    alunos: [],
    fb: false
  };
  try{ sessionStorage.setItem('lab_sessao_orientador', JSON.stringify(STATE.sessaoOrientador)); }catch(e){}
  render();
  // Firebase em paralelo
  const run = async () => {
    if(!window.LabFB){
      await new Promise(r => window.addEventListener("labfb-ready", r, { once:true }));
    }
    try{
      await window.LabFB.criarSessao(codigo);
      if(STATE.sessaoOrientador && STATE.sessaoOrientador.codigo === codigo){
        STATE.sessaoOrientador.fb = true;
        try{ sessionStorage.setItem('lab_sessao_orientador', JSON.stringify(STATE.sessaoOrientador)); }catch(e){}
        iniciarListenerAlunos(codigo);
        render();
      }
    }catch(e){
      console.error(e);
      const msg = (e && (e.message || e.code)) || String(e);
      alert("Não foi possível criar a sessão no Firebase.\n\n" + msg + "\n\nConfira: Firestore criado? Regras em modo teste?");
    }
  };
  run();
}

let _unsubAlunos = null;
let _listenCodigo = null;
function iniciarListenerAlunos(codigo){
  if(!codigo) return;
  if(_unsubAlunos && _listenCodigo === codigo) return; // já ouvindo esta sala
  if(_unsubAlunos){ try{ _unsubAlunos(); }catch(e){} _unsubAlunos=null; }
  _listenCodigo = codigo;
  const start = () => {
    if(!window.LabFB) return;
    _unsubAlunos = window.LabFB.ouvirAlunos(codigo, (lista) => {
      if(!STATE.sessaoOrientador || STATE.sessaoOrientador.codigo !== codigo) return;
      STATE.sessaoOrientador.alunos = lista || [];
      STATE.sessaoOrientador.fb = true;
      try{ sessionStorage.setItem('lab_sessao_orientador', JSON.stringify(STATE.sessaoOrientador)); }catch(e){}
      if(STATE.screen === 'orientador') render();
    });
  };
  if(window.LabFB) start();
  else window.addEventListener('labfb-ready', start, { once:true });
}

function encerrarSessaoLocal(){
  const cod = STATE.sessaoOrientador && STATE.sessaoOrientador.codigo;
  if(_unsubAlunos){ try{ _unsubAlunos(); }catch(e){} _unsubAlunos=null; }
  _listenCodigo = null;
  if(cod && window.LabFB){
    window.LabFB.encerrarSessao(cod).catch(()=>{});
  }
  STATE.sessaoOrientador = null;
  try{ sessionStorage.removeItem('lab_sessao_orientador'); }catch(e){}
  render();
}

function restaurarSessaoLocal(){
  try{
    const raw = sessionStorage.getItem('lab_sessao_orientador');
    if(raw){
      const s = JSON.parse(raw);
      if(s && s.codigo){

}

      if(el){ el.textContent = 'Link copiado.'; setTimeout(()=>{ el.textContent=''; }, 2000); }

/** Lista completa de opções de uma etapa (para o acordeão do relatório) */
function listaOpcoesDaEtapa(chave){
  if(chave === 'procedimento'){
    return DATA.procedimentos.map(function(p){
      return { id: p.id, texto: p.nome, extra: '', verso: p.desc };
    });
  }
  var prefixMap = {
    natureza: 'G_NAT', finalidade: 'G_FIN', abordagem: 'G_ABO',
    metodo: 'G_MET', temporalidade: 'G_TEM', validade: 'G_VAL'
  };
  var prefix = prefixMap[chave];
  if(!prefix) return [];
  return DATA.opcoes
    .filter(function(o){ return o.id.indexOf(prefix) === 0; })
    .sort(function(a,b){ return (a.ordem||0)-(b.ordem||0); });
}

/** Normaliza o valor salvo pelo aluno (texto ou id ou objeto) */
function normalizarEscolha(valorSalvo){
  if(!valorSalvo) return '';
  if(typeof valorSalvo === 'object'){
    return String(valorSalvo.texto || valorSalvo.id || valorSalvo.nome || '').trim();
  }
  return String(valorSalvo).trim();
}

/** Monta subcards de TODAS as opções; a escolhida fica em destaque */
function htmlSubcardsOpcoes(chave, valorSalvo){
  var escolhido = normalizarEscolha(valorSalvo);
  var lista = listaOpcoesDaEtapa(chave);
  if(!lista.length){
    // campo livre
    var txt = escolhido || '—';
    return '<div class="texto-livre">'+txt.replace(/</g,'&lt;')+'</div>';
  }
  return '<div class="opt-stack">'+lista.map(function(o){
    var isEscolhida = (o.texto === escolhido || o.id === escolhido || o.nome === escolhido);
    var badge = isEscolhida ? '<span class="opt-badge">Escolha do aluno</span>' : '';
    var extra = o.extra ? '<div class="opt-extra">'+String(o.extra).replace(/</g,'&lt;')+'</div>' : '';
    var verso = o.verso ? '<p class="opt-verso">'+String(o.verso).replace(/</g,'&lt;')+'</p>' : '';
    return '<div class="opt-sub'+(isEscolhida?' escolhida':'')+'">'+
      '<div class="opt-head"><span class="opt-titulo">'+String(o.texto||o.nome||'').replace(/</g,'&lt;')+'</span>'+badge+'</div>'+
      extra + verso +
    '</div>';
  }).join('')+'</div>';
}

function rowTeoria(titulo, chave, valorSalvo){
  var escolhido = normalizarEscolha(valorSalvo) || '—';
  var body = htmlSubcardsOpcoes(chave, valorSalvo);
  return '<details class="acc-item"><summary>'+titulo+
    ' <span style="font-weight:500;opacity:.7;font-size:12px;">· '+escolhido.replace(/</g,'&lt;')+'</span>'+
    '</summary><div class="acc-body">'+body+'</div></details>';
}

/* Entrar na sala (aluno) — mock */

function normalizarCodigoSala(c){
  return String(c||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
}

function validarCodigoSalaMock(codigo){
  codigo = normalizarCodigoSala(codigo);
  if(codigo.length < 4) return { ok:false, msg:'Digite o código completo da sala.' };
  // 1) Sessão neste aparelho (professor testando)
  try{
    const raw = sessionStorage.getItem('lab_sessao_orientador');
    if(raw){
      const s = JSON.parse(raw);
      if(s && normalizarCodigoSala(s.codigo) === codigo) return { ok:true, codigo };
    }
  }catch(e){}
  // 2) Mock sem Firebase: aceita formato válido e avisa que a validação real virá com a nuvem
  //    Para não bloquear o teste do fluxo do aluno em outro celular, aceitamos código de 6 chars
  //    mas marcamos como "mockAceito".
  if(codigo.length === 6) return { ok:true, codigo, mockAceito:true };
  return { ok:false, msg:'Não há sessão ativa com esse código.' };
}

async function confirmarCodigoSala(){
  const inp = document.getElementById('inputCodigoSala');
  const err = document.getElementById('erroCodigoSala');
  if(!inp) return;
  const codigo = normalizarCodigoSala(inp.value);
  if(codigo.length < 4){
    if(err) err.textContent = 'Digite o código completo da sala.';
    return;
  }
  if(err) err.textContent = 'Verificando…';
  try{
    if(!window.LabFB){
      await new Promise(r => window.addEventListener("labfb-ready", r, { once:true }));
    }
    const ativa = await window.LabFB.sessaoAtiva(codigo);
    if(!ativa){
      // fallback mock no mesmo aparelho do professor
      const r = validarCodigoSalaMock(codigo);
      if(!r.ok || r.mockAceito){
        if(err) err.textContent = 'Não há sessão ativa com esse código.';
        return;
      }
    }
    STATE.alunoSessao = { codigo, nome:'', avatar:'' };
    goto('entrarSalaDados');
  }catch(e){
    console.error(e);
    if(err) err.textContent = 'Erro: ' + ((e && e.message) || 'ao verificar a sala');
  }
}

function screenSobre(){
  return `<div class="brand"><div><div class="brand-name">Sobre</div><div class="brand-title">O Laboratório do Pesquisador</div></div></div>
  <div class="section">
    <div class="card">
      <p>Este protótipo simula, de forma interativa, a construção de um delineamento de pesquisa em Educação Física: da definição da natureza do estudo até a emissão de um Parecer Técnico de Avaliação Metodológica.</p>
      <p>Você assume o papel de <b>pesquisador júnior</b>. O Rigor Metodológico é calculado a partir de três pilares — <b>Coerência Epistemológica</b> (30%), <b>Controle de Viés</b> (40%) e <b>Generalização e Escopo</b> (30%) — e acompanha o pesquisador júnior em todas as fases.</p>
      <p class="muted" style="font-family:var(--mono);font-size:11px;margin:0;">Prof. Dr. Mário César Nascimento — UDESC/CEFID, 2026</p>
    </div>
    <button class="btn btn-secondary" style="margin-top:14px;" onclick="goto('inicio')">← Voltar</button>
  </div>`;
}

    <div class="subarea-grid">
      ${DATA.subareas.filter(s=>s.ativo).map(s=>`
        <button class="subarea-btn" onclick="selecionarSubarea(${s.id})">
          <div class="num">${String(s.id).padStart(2,'0')}</div>
          <div class="nome">${s.nome}</div>

/* ---- TEXTO METODOLÓGICO MONTADO ---- */
function art(palavra){
  // artigo indefinido coerente em português (a/um)
  const fem = /a$|ade$|agem$|ção$|são$|dade$|tude$|ie$|iz$/i.test(palavra);
  // casos especiais
  const mapa = {
    'Exploratória':'uma pesquisa de natureza exploratória',
    'Descritiva':'uma pesquisa de natureza descritiva',
    'Explicativa':'uma pesquisa de natureza explicativa',
    'Básica':'finalidade básica',
    'Aplicada':'finalidade aplicada',
    'Quantitativa':'abordagem quantitativa',
    'Qualitativa':'abordagem qualitativa',
    'Mista':'abordagem mista',
    'Dedutivo':'método dedutivo',
    'Indutivo':'método indutivo',
    'Dialético':'método dialético',
    'Fenomenológico':'método fenomenológico',
    'Experimental':'delineamento experimental',
    'Observacional':'delineamento observacional',
    'Qualitativo':'delineamento qualitativo',
    'Transversal':'corte transversal',
    'Longitudinal':'acompanhamento longitudinal',
    'Coorte':'desenho de coorte'
  };
  return mapa[palavra] || palavra.toLowerCase();
}

function montarDescricaoMetodo(){
  const nat = STATE.fase1.natureza?.texto;
  const fin = STATE.fase1.finalidade?.texto;
  const abo = STATE.fase2.abordagem?.texto;
  const met = STATE.fase2.metodo?.texto;
  const proc = STATE.fase3.procedimento;
  const temp = STATE.fase3.temporalidade?.texto;
  const val = STATE.fase4.validade?.texto;
  const viVd = (STATE.fase3.viVd||'').trim();
  const amostra = (STATE.fase3.amostra||'').trim();
  const controle = (STATE.fase3.controle||'').trim();
  const c = STATE.cenario;

  let p = '';

  // Abertura com cenário
  if(c){
    p += `A partir da situação-problema “${c.titulo}”, formulou-se a seguinte pergunta de pesquisa: ${c.pergunta} `;
  }

  // Natureza + finalidade
  if(nat && fin){
    p += `O estudo caracteriza-se como ${art(nat)}, com ${art(fin)}. `;
  } else if(nat){
    p += `O estudo caracteriza-se como ${art(nat)}. `;
  }

  // Abordagem + método
  if(abo && met){
    p += `Adota-se ${art(abo)}, orientada pelo ${art(met)}. `;
  } else if(abo){
    p += `Adota-se ${art(abo)}. `;
  }

  // Procedimento + temporalidade
  if(proc && temp){
    const procTxt = art(proc);
    const tempTxt = art(temp);
    p += `O ${procTxt} será conduzido em ${tempTxt}. `;
  } else if(proc){
    p += `O ${art(proc)} orienta a coleta e a análise dos dados. `;
  }

  // Variáveis
  if(viVd){
    p += `Quanto às variáveis, registra-se: ${viVd.replace(/\s+/g,' ').replace(/\.$/,'')}. `;
  }

  // Amostra
  if(amostra){
    p += `A amostra e os critérios de seleção foram assim definidos: ${amostra.replace(/\s+/g,' ').replace(/\.$/,'')}. `;
  }

  // Controle
  if(controle){
    p += `Para o controle de variáveis estranhas, prevê-se: ${controle.replace(/\s+/g,' ').replace(/\.$/,'')}. `;
  }

  // Validade
  if(val){
    if(val.includes('Interna')){
      p += `Prioriza-se a validade interna, com ênfase no controle de vieses e na confiança de que os resultados se devem ao que foi investigado.`;
    } else if(val.includes('Externa')){
      p += `Prioriza-se a validade externa, ampliando a possibilidade de generalização dos achados para outros contextos.`;
    } else {
      p += `Busca-se o equilíbrio entre validade interna e externa, justificando conscientemente as decisões de controle e de amostragem.`;
    }
  }

  return p.trim() || 'As decisões metodológicas ainda não foram registradas de forma completa.';
}

function toggleFlip(id){
  STATE.flipOpen[id]=!STATE.flipOpen[id];
  render();
  // After expand, ensure the opened card is fully visible (page scrolls)
  if(STATE.flipOpen[id]){
    requestAnimationFrame(()=>{
      const el=document.getElementById('card-'+id);
      if(el) el.scrollIntoView({behavior:'smooth', block:'nearest'});
    });
  }
}
function escolherOpcao(group,id){
  const opt=findOpt(id);
  if(group==='natureza') STATE.fase1.natureza=opt;
  if(group==='finalidade') STATE.fase1.finalidade=opt;
  if(group==='abordagem') STATE.fase2.abordagem=opt;
  if(group==='metodo') STATE.fase2.metodo=opt;
  if(group==='temporalidade') STATE.fase3.temporalidade=opt;
  if(group==='validade') STATE.fase4.validade=opt;
  // Keep the selected card open so the user sees confirmation
  STATE.flipOpen[id]=true;

}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc,
  collection, onSnapshot, serverTimestamp, getDocs
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAXjrSQUbsK9EMp5gxMyFHzQjIVDIzOuRw",
  authDomain: "laboratoriodopesquisador.firebaseapp.com",
  projectId: "laboratoriodopesquisador",
  storageBucket: "laboratoriodopesquisador.firebasestorage.app",
  messagingSenderId: "779464235643",
  appId: "1:779464235643:web:7a9c220660f07531f720de",
  measurementId: "G-QZ5RQ5RJQG"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.LabFB = {
  db,
  async criarSessao(codigo){
    const ref = doc(db, "sessoes", codigo);
    await setDoc(ref, {
      ativa: true,
      criadaEm: serverTimestamp(),
      criadaEmMs: Date.now()
    });
    return codigo;
  },
  async encerrarSessao(codigo){
    if(!codigo) return;
    const ref = doc(db, "sessoes", codigo);
    try { await updateDoc(ref, { ativa: false, encerradaEmMs: Date.now() }); } catch(e){}
    // opcional: não apagamos alunos no MVP; sessão fica inativa
  },
  async sessaoAtiva(codigo){
    const ref = doc(db, "sessoes", codigo);
    const snap = await getDoc(ref);
    if(!snap.exists()) return false;
    const d = snap.data();
    return d.ativa === true;
  },
  async entrarAluno(codigo, alunoId, dados){
    const ref = doc(db, "sessoes", codigo, "alunos", alunoId);
    await setDoc(ref, {
      ...dados,
      atualizadoEmMs: Date.now()
    }, { merge: true });
  },
  async atualizarAluno(codigo, alunoId, dados){
    const ref = doc(db, "sessoes", codigo, "alunos", alunoId);
    await setDoc(ref, {
      ...dados,
      atualizadoEmMs: Date.now()
    }, { merge: true });
  },
  ouvirAlunos(codigo, callback){
    const col = collection(db, "sessoes", codigo, "alunos");
    return onSnapshot(col, (snap) => {
      const lista = [];
      snap.forEach(docu => lista.push({ id: docu.id, ...docu.data() }));
      console.log("alunos snapshot", codigo, lista.length);
      callback(lista);
    }, (err) => {
      console.error("ouvirAlunos", err);
      callback([]);
    });
  },
  async listarAlunos(codigo){
    const col = collection(db, "sessoes", codigo, "alunos");
    const snap = await getDocs(col);
    const lista = [];
    snap.forEach(docu => lista.push({ id: docu.id, ...docu.data() }));
    return lista;
  }
};

window.dispatchEvent(new Event("labfb-ready"));
console.log("LabFB ready");
</script>
