{"regra_id":"RP12","componente":"Parecer final","peso_pct":null,"condicao":"Pontuação entre 60 e 84","credito":null,"descricao":"Estratégia adequada, com ajustes necessários."},{"regra_id":"RP13","componente":"Parecer final","peso_pct":null,"condicao":"Pontuação entre 0 e 59","credito":null,"descricao":"Escolha instrumental precisa ser revista."}],"missao_integrativa":[{"ordem":1,"decisao":"Tipo de dado necessário","dimensao":"Adequação ao problema","peso_interno_pct":12.5,"registro_esperado":"Selecionar o tipo de informação coerente com a pergunta."},{"ordem":2,"decisao":"Fonte principal","dimensao":"Adequação ao problema","peso_interno_pct":12.5,"registro_esperado":"Selecionar participantes, ambiente, documentos ou registros pertinentes."},{"ordem":3,"decisao":"Instrumento principal","dimensao":"Adequação ao problema","peso_interno_pct":12.5,"registro_esperado":"Escolher entrevista, observação ou questionário conforme o dado."},{"ordem":4,"decisao":"Modalidade do instrumento","dimensao":"Domínio dos tipos","peso_interno_pct":12.5,"registro_esperado":"Selecionar o tipo específico e coerente."},{"ordem":5,"decisao":"Aplicação ou registro","dimensao":"Qualidade do instrumento","peso_interno_pct":12.5,"registro_esperado":"Definir condução, protocolo, escala ou forma de registro."},{"ordem":6,"decisao":"Cuidado metodológico prioritário","dimensao":"Qualidade do instrumento","peso_interno_pct":12.5,"registro_esperado":"Identificar o risco central e a medida preventiva."},{"ordem":7,"decisao":"Instrumento complementar","dimensao":"Integração das fontes","peso_interno_pct":12.5,"registro_esperado":"Selecionar complemento somente quando houver finalidade explícita."},{"ordem":8,"decisao":"Limitação principal","dimensao":"Integração das fontes","peso_interno_pct":12.5,"registro_esperado":"Reconhecer o que a estratégia não permite concluir."}]};</script>
<script>
const AVATAR_FULL='avatar-orientador-corpo.png';
const AVATAR_FACE='avatar-orientador-rosto.png';
const S={screen:'home',subarea:null,manifest:null,pos:0,attempt:0,completedBlock:null,firstAnswers:{},credits:{},dimensions:{'Adequação ao problema':[],'Domínio dos tipos':[],'Qualidade do instrumento':[],'Integração das fontes':[]}};
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function brand(kicker='UDESC · CEFID',showAvatar=false){return '<div class="brand"><div><div class="brand-name">'+kicker+'</div><div class="brand-title">Laboratório do Pesquisador</div></div>'+(showAvatar?'<div class="brand-figure"><img src="'+AVATAR_FULL+'" alt="Orientador"></div>':'')+'</div>'}
function footer(){return '<div class="footer">Laboratório do Pesquisador — Instrumentos de Coleta<br>Prof. Dr. Mário César Nascimento ©</div>'}
function orient(text){return '<div class="orientador"><div class="orientador-avatar"><img src="'+AVATAR_FACE+'" alt="Rosto do Orientador"></div><div><b>ORIENTADOR</b><span>'+text+'</span></div></div>'}
function render(){const app=$('#app');if(S.screen==='home')app.innerHTML=home();else if(S.screen==='subareas')app.innerHTML=subareas();else if(S.screen==='intro')app.innerHTML=intro();else if(S.screen==='labIntro')app.innerHTML=labIntro();else if(S.screen==='quiz')app.innerHTML=quiz();else if(S.screen==='labSummary')app.innerHTML=labSummary();else app.innerHTML=final();window.scrollTo({top:0,behavior:'smooth'})}
function home(){return brand('UDESC · CEFID',true)+`<section class="hero"><span class="eyebrow">Instrumentos de coleta</span><h1>Da pergunta ao dado</h1><p>Aprenda a reconhecer entrevistas, observações e questionários — e decida quando cada instrumento é metodologicamente adequado.</p></section><section class="card mission"><span class="eyebrow">Sua missão</span><p>Você assume o papel de <b>pesquisador júnior</b>. Sua jornada passa por três ambientes de investigação: o <b>Laboratório da Entrevista</b>, o <b>Laboratório da Observação</b> e o <b>Laboratório do Questionário</b>. Em cada um, você aprende a reconhecer diferentes instrumentos, compreender quando utilizá-los e avaliar seus cuidados metodológicos.</p><p>Ao final, você enfrenta uma <b>Missão Integrativa</b>, na qual deverá decidir qual instrumento — ou combinação de instrumentos — é mais adequado para investigar um novo projeto de pesquisa e receber o <b>Parecer Final</b> do seu Orientador.</p></section><button class="btn gold block" onclick="goSubareas()">Iniciar atividade</button><div class="row"><button class="btn secondary block" onclick="notice('Sala ao vivo será conectada na próxima etapa.')">Entrar em uma sala</button><button class="btn secondary block" onclick="notice('Módulo do Orientador será conectado na próxima etapa.')">Orientador</button></div>`+footer()}
function goSubareas(){S.screen='subareas';render()}
function subareas(){return brand('Escolha inicial')+`<span class="eyebrow">Preferência temática</span><h1 class="screen-title">Escolha sua subárea</h1><p class="muted">Todas as situações do percurso pertencerão à área escolhida. Para trocar, será necessário iniciar novamente.</p><div class="grid">${DATA.subareas.filter(x=>x.ativo).map(x=>`<button class="subarea" onclick="chooseArea(${x.id})"><span class="num">${String(x.id).padStart(2,'0')}</span><span><b>${esc(x.nome)}</b><small>${esc(x.descricao)}</small></span></button>`).join('')}</div><button class="btn ghost block" onclick="S.screen='home';render()">← Voltar</button>`+footer()}
function rng(seed){let h=2166136261;for(const c of seed)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>((h=Math.imul(h^(h>>>15),2246822507))>>>0)/4294967296}
function shuffled(a,r){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(pool,n,r){return shuffled(pool,r).slice(0,n)}
function obsCovers(xs){const tags=new Set(xs.flatMap(x=>x.cobertura_tags.split('|')));return ['DIRETA','INDIRETA','SISTEMÁTICA','ASSISTEMÁTICA','PARTICIPANTE','NÃO PARTICIPANTE','NATURALÍSTICA','LABORATORIAL'].every(t=>tags.has(t))}
const MISSION_PROFILES={
'Entrevista semiestruturada':['Experiências e significados individuais','Participantes diretamente envolvidos','Entrevista','Semiestruturada','Roteiro com eixos comuns e perguntas de aprofundamento','Condução treinada, consentimento e perguntas não indutivas','Observação, somente se for necessário comparar relatos e práticas','Os relatos não demonstram diretamente o que ocorreu na prática'],
'Observação sistemática naturalística':['Comportamentos e interações observáveis','Ambiente real em que as ações acontecem','Observação','Sistemática e naturalística','Protocolo de categorias acompanhado de diário de campo','Habituação, discrição e controle da concordância entre registros','Entrevista, somente se for necessário compreender os sentidos das ações','A presença do observador pode alterar condutas e o registro cobre apenas o período observado'],
'Questionário escalar':['Frequência, intensidade ou concordância','Conjunto amplo de participantes','Questionário','Escalar','Escala consistente, rotulada e aplicada do mesmo modo','Itens neutros, uma ideia por item e pré-teste','Entrevista, somente se for necessário explicar as razões das respostas','Autorrelatos padronizados não mostram diretamente comportamentos nem aprofundam experiências'],
'Grupo focal':['Posições e significados produzidos na interação','Grupo de participantes com experiência pertinente','Entrevista coletiva','Grupo focal','Roteiro moderado que favoreça circulação equilibrada da fala','Moderação das assimetrias, confidencialidade e redução da conformidade','Entrevista individual, somente se temas sensíveis exigirem privacidade','Vozes dominantes e pressão do grupo podem ocultar posições individuais'],
'Estratégia mista com triangulação':['Percepções, ações observadas e distribuição das respostas','Participantes, ambientes e registros pertinentes','Entrevista, observação e questionário integrados','Modalidades ajustadas a cada tipo de dado','Plano prévio para relacionar resultados produzidos por cada fonte','Qualidade de cada instrumento e regra explícita de integração','Nenhum novo instrumento, salvo se permanecer uma lacuna definida','A convergência não prova verdade absoluta e divergências precisam ser interpretadas']};
const MISSION_QUESTIONS=['Qual tipo de dado deve orientar o plano?','Qual é a fonte principal mais coerente?','Qual instrumento principal produz esse dado?','Qual modalidade deve ser adotada?','Como a aplicação ou o registro deve ser organizado?','Qual cuidado metodológico é prioritário?','Há instrumento complementar metodologicamente justificável?','Qual limitação precisa constar no parecer?'];
function buildMission(c,r){const profile=MISSION_PROFILES[c.conceito_alvo],steps=DATA.missao_integrativa;if(!profile)return [{...c,alternativas:shuffled(DATA.alternativas.filter(a=>a.caso_id===c.id),r)}];const pools=Array.from({length:8},(_,i)=>Object.values(MISSION_PROFILES).map(x=>x[i]));return steps.map((step,i)=>{const correct=profile[i],others=shuffled([...new Set(pools[i].filter(x=>x!==correct))],r).slice(0,3),texts=shuffled([correct,...others],r);return {...c,id:c.id+'-M'+(i+1),titulo:'Decisão '+(i+1)+' — '+step.decisao,pergunta:MISSION_QUESTIONS[i],conceito_alvo:step.decisao,dimensao_principal:step.dimensao,feedback_orientador:step.registro_esperado+' Para este projeto, a decisão coerente é: '+correct+'.',alternativas:texts.map((texto,j)=>({alternativa_id:c.id+'-M'+(i+1)+'-A'+(j+1),caso_id:c.id,ordem:j+1,texto,correta:texto===correct}))}})}
function manifest(area){const pool=DATA.casos.filter(x=>x.subarea_id===area&&x.ativo);const r=rng('demo|'+area+'|'+DATA.meta.versao_banco);const g=n=>pool.filter(x=>x.grupo_sorteio===n);let obs=[];for(let i=0;i<200&&!obs.length;i++){const p=pick(g('OBS_CONFIG'),4,r);if(obsCovers(p))obs=p}if(!obs.length)obs=pick(g('OBS_CONFIG'),4,r);const selected=[...g('ENT_TIPOS'),...pick(g('ENT_QUALIDADE'),2,r),...obs,...g('OBS_REGISTRO'),...g('OBS_REATIVIDADE'),...g('QUE_TIPOS'),...pick(g('QUE_QUALIDADE'),2,r),...pick(g('COMPARACAO_DADOS'),1,r),...pick(g('TRIANGULACAO'),1,r),...pick(g('MISSAO_FINAL'),1,r)];return selected.flatMap(c=>c.bloco==='INTEGRATIVO'?buildMission(c,r):[{...c,alternativas:shuffled(DATA.alternativas.filter(a=>a.caso_id===c.id),r)}])}
function chooseArea(id){S.subarea=DATA.subareas.find(x=>x.id===id);S.manifest=manifest(id);S.pos=0;S.screen='intro';render()}
function intro(){return brand('Subárea definida')+`<span class="lab-badge">${esc(S.subarea.nome)}</span><h1 class="screen-title">Antes dos laboratórios</h1><div class="card"><span class="eyebrow">Aquecimento orientado</span><p>Você verá duas demonstrações sobre o tipo de dado que vem antes da escolha do instrumento. Elas não alteram sua pontuação.</p><div>${DATA.aquecimento.filter(x=>x.subarea_id===S.subarea.id).map(x=>`<p><b>${esc(x.pergunta)}</b><br><span class="muted">${esc(x.explicacao_orientador)}</span></p>`).join('')}</div></div>${orient('Primeiro identifique o dado de que precisa. Só então escolha o instrumento capaz de produzi-lo.')}<button class="btn primary block" onclick="openLab()">Entrar nos laboratórios</button>`+footer()}
function blockMeta(block){return {ENTREVISTA:{step:'Laboratório 1 de 3',title:'Laboratório da Entrevista',lead:'Investigue discursos, experiências e significados sem confundir liberdade de fala com ausência de planejamento.',goals:['Reconhecer cinco modalidades de entrevista','Relacionar estrutura e profundidade ao problema','Avaliar roteiro, condução, registro e viés'],guide:'Leia primeiro o objetivo do estudo. Pergunte quanto de comparabilidade e quanto de aprofundamento a investigação exige.'},OBSERVACAO:{step:'Laboratório 2 de 3',title:'Laboratório da Observação',lead:'Examine acontecimentos, ações e interações no contexto em que ocorrem.',goals:['Combinar os eixos de observação','Escolher formas de registro','Controlar reatividade e vieses'],guide:'Diferencie aquilo que foi observado da interpretação construída pelo pesquisador.'},QUESTIONARIO:{step:'Laboratório 3 de 3',title:'Laboratório do Questionário',lead:'Planeje a coleta padronizada de respostas com clareza, alcance e qualidade.',goals:['Reconhecer formatos de questionário','Escolher escalas e itens adequados','Avaliar validade, clareza e aplicação'],guide:'Um questionário amplo não é necessariamente um bom questionário: cada item precisa servir ao problema.'},COMPARACAO:{step:'Etapa de integração',title:'Comparação e Triangulação',lead:'Compare o que cada fonte produz e quando a combinação acrescenta evidência.',goals:['Distinguir dados produzidos','Justificar complementaridade','Evitar combinações sem finalidade'],guide:'Triangular não é apenas usar mais instrumentos, mas relacionar fontes com uma finalidade explícita.'},INTEGRATIVO:{step:'Etapa final',title:'Missão Integrativa',lead:'Construa uma decisão instrumental coerente para encerrar o percurso.',goals:['Escolher a estratégia principal','Justificar eventuais complementos','Reconhecer limites da decisão'],guide:'A melhor escolha é a que responde ao problema com qualidade e viabilidade, não a que reúne mais instrumentos.'}}[block]}
function openLab(){S.screen='labIntro';render()}
function labSupport(block){if(block==='OBSERVACAO')return `<div class="card"><span class="eyebrow">Mapa da observação</span><h2 class="screen-title">Quatro eixos combináveis</h2><div class="axis-grid"><div class="axis-card"><b>Origem do contato</b><span>Direta × indireta</span></div><div class="axis-card"><b>Planejamento</b><span>Sistemática × assistemática</span></div><div class="axis-card"><b>Papel do pesquisador</b><span>Participante × não participante</span></div><div class="axis-card"><b>Ambiente</b><span>Naturalística × laboratorial</span></div></div><p class="muted"><b>Atenção:</b> depois de combinar os eixos, ainda é preciso definir a forma de registro e reduzir a reatividade provocada pela presença do observador.</p></div>`;if(block==='QUESTIONARIO')return `<div class="card"><span class="eyebrow">Mapa do questionário</span><h2 class="screen-title">Formato do item × qualidade</h2><div class="axis-grid"><div class="axis-card"><b>Aberta</b><span>Resposta livre e maior variedade</span></div><div class="axis-card"><b>Dicotômica</b><span>Duas respostas mutuamente exclusivas</span></div><div class="axis-card"><b>Múltipla escolha</b><span>Categorias previamente definidas</span></div><div class="axis-card"><b>Escalar</b><span>Intensidade, frequência ou concordância</span></div><div class="axis-card"><b>Mista ou semiaberta</b><span>Categorias com possibilidade complementar</span></div><div class="axis-card"><b>Controle de qualidade</b><span>Neutralidade, clareza, cobertura, consistência e pré-teste</span></div></div><p class="muted"><b>Atenção:</b> o formato deve corresponder ao dado necessário. Depois, verifique se o item induz respostas, reúne duas ideias ou deixa opções importantes de fora.</p></div>`;if(block==='COMPARACAO')return `<div class="card"><span class="eyebrow">Mapa da integração</span><h2 class="screen-title">Fontes diferentes, contribuições diferentes</h2><div class="axis-grid"><div class="axis-card"><b>Entrevista</b><span>O que as pessoas relatam, explicam e significam</span></div><div class="axis-card"><b>Observação</b><span>O que acontece nas ações, interações e contextos</span></div><div class="axis-card"><b>Questionário</b><span>Como respostas padronizadas se distribuem no grupo</span></div><div class="axis-card"><b>Documentos e registros</b><span>O que já foi formalizado ou produzido anteriormente</span></div></div><p><span class="pill">1</span> Defina o dado principal.</p><p><span class="pill">2</span> Escolha o instrumento que o produz.</p><p><span class="pill">3</span> Acrescente outra fonte apenas se ela responder a uma lacuna explícita.</p><p class="muted"><b>Atenção:</b> triangulação não significa repetir a mesma pergunta com vários instrumentos nem acumular dados sem um plano de relação entre as fontes.</p></div>`;return ''}
function missionSupport(block){if(block!=='INTEGRATIVO')return '';return `<div class="card"><span class="eyebrow">Plano de coleta em construção</span><h2 class="screen-title">Oito decisões encadeadas</h2>${DATA.missao_integrativa.map(x=>`<p><span class="pill">${x.ordem}</span> <b>${esc(x.decisao)}</b><br><span class="muted">${esc(x.registro_esperado)}</span></p>`).join('')}<p class="muted"><b>Atenção:</b> todas as respostas serão fechadas. O desafio é manter coerência entre as oito decisões do mesmo projeto.</p></div>`}
function theoryReview(block){let body='';if(block==='ENTREVISTA')body=`<p>A entrevista é uma interação planejada para compreender relatos, experiências e significados. A escolha do tipo depende do equilíbrio desejado entre <b>comparabilidade</b> e <b>aprofundamento</b>.</p><div class="axis-grid"><div class="axis-card"><b>Estruturada</b><span>Mesmas perguntas e ordem; favorece comparação.</span></div><div class="axis-card"><b>Semiestruturada</b><span>Eixos comuns com liberdade para sondar.</span></div><div class="axis-card"><b>Não estruturada</b><span>Ampla liberdade em fenômenos pouco delimitados.</span></div><div class="axis-card"><b>Narrativa</b><span>Trajetórias e acontecimentos ao longo do tempo.</span></div><div class="axis-card"><b>Grupo focal</b><span>Sentidos produzidos na interação do grupo.</span></div></div><p class="theory-note"><b>Antes de aplicar:</b> formule uma ideia por pergunta, evite indução, planeje sondagens, proteja a privacidade e teste o roteiro.</p>`;else if(block==='OBSERVACAO')body=`<p>A observação registra ações, interações e contextos — aquilo que acontece, e não apenas o que as pessoas dizem que acontece. Sua configuração combina quatro eixos.</p><div class="axis-grid"><div class="axis-card"><b>Contato</b><span>Direta × indireta</span></div><div class="axis-card"><b>Planejamento</b><span>Sistemática × assistemática</span></div><div class="axis-card"><b>Papel</b><span>Participante × não participante</span></div><div class="axis-card"><b>Ambiente</b><span>Naturalística × laboratorial</span></div></div><p class="theory-note"><b>Para registrar melhor:</b> separe descrição e interpretação no diário de campo e considere a reatividade causada pela presença do observador.</p>`;else if(block==='QUESTIONARIO')body=`<p>O questionário coleta respostas de forma padronizada e pode alcançar muitas pessoas. O formato do item deve corresponder ao dado necessário; padronização, por si só, não garante qualidade.</p><div class="axis-grid"><div class="axis-card"><b>Aberta</b><span>Resposta livre.</span></div><div class="axis-card"><b>Dicotômica</b><span>Duas condições excludentes.</span></div><div class="axis-card"><b>Múltipla escolha</b><span>Categorias previamente definidas.</span></div><div class="axis-card"><b>Escalar</b><span>Grau, frequência ou concordância.</span></div><div class="axis-card"><b>Mista</b><span>Categorias e complemento livre.</span></div></div><p class="theory-note"><b>Controle de qualidade:</b> use linguagem neutra, uma ideia por item, opções suficientes e não sobrepostas, escala consistente e pré-teste.</p>`;else if(block==='COMPARACAO')body=`<p>Cada instrumento ilumina uma dimensão diferente. A decisão começa pelo dado necessário, não pelo instrumento preferido.</p><div class="axis-grid"><div class="axis-card"><b>Entrevista</b><span>Relatos, explicações e significados.</span></div><div class="axis-card"><b>Observação</b><span>Ações, interações e contexto.</span></div><div class="axis-card"><b>Questionário</b><span>Distribuição de respostas padronizadas.</span></div><div class="axis-card"><b>Documentos</b><span>Registros já formalizados.</span></div></div><p class="theory-note"><b>Triangulação:</b> combine fontes somente quando cada uma cobrir uma lacuna explícita e houver um plano para relacionar os dados.</p>`;else body=`<p>Na missão final, você construirá um plano coerente. Cada escolha deve decorrer da anterior: o objetivo define o dado; o dado orienta a fonte, o instrumento, sua modalidade e a forma de aplicação.</p>${DATA.missao_integrativa.map(x=>`<p><span class="pill">${x.ordem}</span> <b>${esc(x.decisao)}</b><br><span class="muted">${esc(x.registro_esperado)}</span></p>`).join('')}<p class="theory-note"><b>Regra de coerência:</b> um instrumento complementar só se justifica quando cobre uma lacuna. Ao final, reconheça também o que o plano não permite concluir.</p>`;return `<details class="theory-panel card"><summary><span><span class="theory-kicker">Apoio formativo opcional</span>Revisar conceitos antes de começar</span><span class="theory-time">Leitura · 2 min</span></summary><div class="theory-body">${body}</div></details>`}
function labIntro(){const c=S.manifest[S.pos],m=blockMeta(c.bloco),count=S.manifest.filter(x=>x.bloco===c.bloco).length;return brand(m.title,true)+`<span class="phase">${m.step}</span><span class="lab-badge">${esc(S.subarea.nome)}</span><div class="card mission"><span class="eyebrow">Objetivo do ambiente</span><h1 class="screen-title">${m.title}</h1><p>${m.lead}</p><div>${m.goals.map(x=>`<p><span class="pill">✓</span> ${x}</p>`).join('')}</div><p class="muted">Este ambiente possui ${count} decisões avaliativas.</p></div>${theoryReview(c.bloco)}${orient(m.guide)}<button class="btn primary block" onclick="startQuiz()">Começar este ambiente</button>`+footer()}
function startQuiz(){S.screen='quiz';render()}
function labName(c){return {ENTREVISTA:'Laboratório da Entrevista',OBSERVACAO:'Laboratório da Observação',QUESTIONARIO:'Laboratório do Questionário',COMPARACAO:'Comparação e Triangulação',INTEGRATIVO:'Missão Integrativa'}[c.bloco]}
function caseTitle(c){return c.titulo.includes(':')?c.titulo.split(':').slice(1).join(':').trim():c.titulo}
function quiz(){const c=S.manifest[S.pos],same=S.manifest.filter(x=>x.bloco===c.bloco),local=same.findIndex(x=>x.id===c.id)+1,pct=Math.round((local-1)/same.length*100);return brand(labName(c))+`<span class="phase">Decisão ${local} de ${same.length}</span><div class="progress"><i style="width:${pct}%"></i></div><span class="lab-badge">${esc(S.subarea.nome)}</span><div class="card"><span class="eyebrow">Decisão metodológica</span><h1 class="screen-title">${esc(caseTitle(c))}</h1><p class="muted">${esc(c.situacao)}</p><p class="question"><b>${esc(c.pergunta)}</b></p><div class="options" id="options">${c.alternativas.map(a=>`<button class="opt" data-id="${a.alternativa_id}" onclick="answer('${a.alternativa_id}')">${esc(a.texto)}</button>`).join('')}</div><div id="feedback"></div></div>`+footer()}
function hintFor(c){const t=c.conceito_alvo,g=c.grupo_sorteio;if(g==='ENT_TIPOS'){const h={Estruturada:'Quanto o estudo precisa comparar respostas? Perguntas idênticas e na mesma ordem aumentam a padronização.',Semiestruturada:'Procure o equilíbrio entre comparação e aprofundamento: eixos comuns podem conviver com perguntas como “como?” e “por quê?”.','Não estruturada':'O fenômeno ainda está pouco delimitado? Nesse caso, pense em quanto espaço o participante precisa para conduzir a fala.',Narrativa:'O dado esperado é uma trajetória ou uma sequência de acontecimentos ao longo do tempo?','Grupo focal':'O que interessa surge da interação entre participantes ou apenas de respostas individuais?'};return h[t]}if(g==='ENT_QUALIDADE')return 'Leia a formulação como participante: ela sugere uma resposta, reúne assuntos, expõe alguém ou dificulta o registro? Escolha o procedimento que reduz esse risco.';if(g==='OBS_CONFIG')return 'Separe a decisão em quatro perguntas: contato direto ou por registros? Há roteiro prévio? O pesquisador participa? O ambiente é real ou controlado?';if(g==='OBS_REGISTRO')return 'Pense em como distinguir o que foi visto da interpretação do pesquisador. Um bom registro preserva ambos sem misturá-los.';if(g==='OBS_REATIVIDADE')return 'As pessoas podem mudar o comportamento quando percebem o observador. Qual procedimento reduz essa alteração?';if(g==='QUE_TIPOS'){const h={Aberta:'O participante precisa formular livremente a resposta ou escolher entre categorias?',Dicotômica:'O fenômeno admite somente duas condições realmente excludentes?',Escalar:'O objetivo é medir grau, frequência, intensidade ou concordância?','Múltipla escolha':'Existem categorias conhecidas e mais de duas respostas possíveis?','Mista ou semiaberta':'As categorias cobrem a maioria dos casos, mas ainda pode surgir uma resposta não prevista?'};return h[t]}if(g==='QUE_QUALIDADE'){const h={'Pergunta indutiva':'Alguma palavra empurra o participante para uma resposta considerada desejável?','Duas ideias no mesmo item':'Uma pessoa poderia concordar com uma parte da frase e discordar da outra?','Alternativas não exaustivas':'Imagine respostas reais: alguma delas ficaria sem opção adequada?','Escala inconsistente':'Os rótulos e intervalos seguem a mesma lógica do início ao fim?','Ausência de pré-teste':'O que deve acontecer antes da aplicação definitiva para revelar ambiguidades e falhas?'};return h[t]}if(c.bloco==='COMPARACAO')return 'Não escolha pela quantidade de instrumentos. Identifique o dado principal e veja qual segunda fonte cobre uma lacuna diferente.';if(c.bloco==='INTEGRATIVO')return 'Volte ao objetivo e confira a cadeia: dado necessário, fonte, instrumento, modalidade, aplicação, cuidado, complemento e limitação devem contar a mesma história metodológica.';return 'Volte ao objetivo: qual dado é necessário e qual escolha o produz com menor risco de distorção?'}
function answer(id){const c=S.manifest[S.pos],a=c.alternativas.find(x=>x.alternativa_id===id),buttons=[...document.querySelectorAll('.opt')];if(S.attempt===0)S.firstAnswers[c.id]=id;S.attempt++;buttons.forEach(b=>{if(b.dataset.id===id)b.classList.add(a.correta?'correct':'wrong');b.disabled=true});if(a.correta){const credit=S.attempt===1?1:.5;S.credits[c.id]=credit;S.dimensions[c.dimensao_principal].push(credit);$('#feedback').innerHTML=orient(esc(c.feedback_orientador))+`<button class="btn primary block" onclick="next()">Continuar</button>`}else if(S.attempt<2){$('#feedback').innerHTML=orient('Uma pista para pensar: '+esc(hintFor(c)))+`<button class="btn secondary block" onclick="retry()">Tentar novamente com a dica</button>`}else{S.credits[c.id]=0;S.dimensions[c.dimensao_principal].push(0);buttons.forEach(b=>{const x=c.alternativas.find(a=>a.alternativa_id===b.dataset.id);if(x.correta)b.classList.add('correct')});$('#feedback').innerHTML=orient(esc(c.feedback_orientador))+`<button class="btn primary block" onclick="next()">Continuar</button>`}}
function retry(){document.querySelectorAll('.opt').forEach(b=>{b.disabled=false;b.classList.remove('wrong')});$('#feedback').innerHTML=''}
function next(){const completed=S.manifest[S.pos].bloco;S.pos++;S.attempt=0;if(S.pos>=S.manifest.length)S.screen='final';else if(S.manifest[S.pos].bloco!==completed){S.completedBlock=completed;S.screen='labSummary'}render()}
function labSummary(){const m=blockMeta(S.completedBlock),items=S.manifest.filter(c=>c.bloco===S.completedBlock),vals=items.map(c=>S.credits[c.id]??0),score=Math.round(vals.reduce((a,b)=>a+b,0)/(vals.length||1)*100),initial=items.filter(c=>S.credits[c.id]===1).length,concepts=[...new Set(items.map(c=>c.conceito_alvo))];return brand('Síntese do ambiente')+`<span class="lab-badge">${esc(S.subarea.nome)}</span><div class="card"><span class="eyebrow">Ambiente concluído</span><h1 class="screen-title">${m.title}</h1><div class="score">${score}<small>%</small></div><p style="text-align:center" class="muted">${initial} de ${items.length} decisões resolvidas sem orientação.</p><div style="text-align:center">${concepts.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div></div>${orient(score>=85?'Você reconheceu as escolhas centrais deste ambiente com boa autonomia. Agora transfira esse raciocínio para o próximo tipo de instrumento.':score>=60?'Você compreendeu a maior parte das escolhas. Leve para a próxima etapa os critérios revistos com o feedback.':'Antes de avançar, retenha a regra central: o instrumento deve ser escolhido pelo dado necessário e pelos cuidados de produção desse dado.')}<button class="btn gold block" onclick="openLab()">Conhecer a próxima etapa</button>`+footer()}
function final(){const vals=Object.values(S.credits),total=vals.length,initial=vals.filter(x=>x===1).length,guided=vals.filter(x=>x===.5).length,failed=vals.filter(x=>x===0).length,firstPct=Math.round(initial/(total||1)*100);const defs=[['ENTREVISTA','Entrevista',20],['OBSERVACAO','Observação',20],['QUESTIONARIO','Questionário',20],['COMPARACAO','Comparação e triangulação',15],['INTEGRATIVO','Missão Integrativa',25]];const avgBlock=block=>{const ids=S.manifest.filter(c=>c.bloco===block).map(c=>c.id),v=ids.map(id=>S.credits[id]??0);return v.reduce((a,b)=>a+b,0)/(v.length||1)};const components=defs.map(([block,label,weight])=>({block,label,weight,pct:Math.round(avgBlock(block)*100),points:avgBlock(block)*weight})),score=Math.round(components.reduce((a,b)=>a+b.points,0));const verdict=score>=85?'Estratégia metodologicamente consistente':score>=60?'Estratégia adequada, com ajustes necessários':'Escolha instrumental precisa ser revista';const autonomy=firstPct>=80?'Autônomo':score>=60&&failed/Math.max(total,1)<.25?'Orientado':'Em desenvolvimento';const dimScores=Object.entries(S.dimensions).map(([label,v])=>({label,pct:Math.round(v.reduce((a,b)=>a+b,0)/(v.length||1)*100)}));const strongest=[...components].sort((a,b)=>b.pct-a.pct)[0],weakest=[...components].sort((a,b)=>a.pct-b.pct)[0];const advice={ENTREVISTA:'Retome a relação entre profundidade, comparabilidade, modalidade da entrevista e cuidados de condução.',OBSERVACAO:'Revise os quatro eixos da observação, a forma de registro e o controle da reatividade.',QUESTIONARIO:'Revise a correspondência entre tipo de dado, formato do item, qualidade da redação e pré-teste.',COMPARACAO:'Retome a finalidade de cada fonte e use triangulação apenas quando houver complementaridade explícita.',INTEGRATIVO:'Reveja o encadeamento entre dado, fonte, instrumento, modalidade, aplicação, cuidado, complemento e limitação.'};const componentCards=components.map(x=>`<div class="report-card"><strong>${x.pct}%</strong><b>${x.label}</b><span>Peso ${x.weight}% · contribuição ${x.points.toFixed(1)} pontos</span></div>`).join('');const bars=dimScores.map(x=>`<div class="barrow"><span>${x.label}</span><div class="bar"><i style="width:${x.pct}%"></i></div><b>${x.pct}</b></div>`).join('');return brand('Parecer final')+`<span class="lab-badge">${esc(S.subarea.nome)}</span><div class="card"><span class="eyebrow">Relatório de desempenho metodológico</span><div class="score">${score}<small>%</small></div><h1 class="screen-title" style="text-align:center">${verdict}</h1><p style="text-align:center"><span class="pill">Autonomia: ${autonomy}</span></p><div class="report-kpis"><div class="report-kpi"><b>${initial}</b><span>iniciais</span></div><div class="report-kpi"><b>${guided}</b><span>orientados</span></div><div class="report-kpi"><b>${failed}</b><span>persistentes</span></div></div><p class="muted" style="text-align:center">${firstPct}% das ${total} decisões foram resolvidas sem orientação.</p></div><div class="card"><span class="eyebrow">Desempenho ponderado</span><h2 class="screen-title">Etapas do percurso</h2><div class="report-grid">${componentCards}</div></div><div class="card"><span class="eyebrow">Competências mobilizadas</span><h2 class="screen-title">Quatro dimensões</h2>${bars}</div><div class="report-note"><b>Ponto forte — ${strongest.label}:</b> ${strongest.pct}% de aproveitamento.</div><div class="report-note"><b>Prioridade de revisão — ${weakest.label}:</b> ${advice[weakest.block]}</div>${orient(autonomy==='Autônomo'?'Você manteve coerência com elevada independência. O próximo desafio é justificar essas escolhas em um projeto real.':autonomy==='Orientado'?'O feedback permitiu corrigir decisões importantes. Retome a prioridade indicada antes de transferir o plano para uma pesquisa real.':'Persistiram incoerências após a orientação. Recomendo refazer o percurso e observar especialmente a relação entre o problema e o dado necessário.')}<div class="report-actions"><button class="btn secondary block" onclick="window.print()">Imprimir ou salvar em PDF</button><button class="btn gold block" onclick="location.reload()">Novo percurso</button></div>`+footer()}
function notice(t){const e=$('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2800)}render();
</script></body></html>
